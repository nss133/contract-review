[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-api"
version = "0.1.0"
description = "Python 3.9 API for the closed-network contract review application"
requires-python = ">=3.9,<3.10"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn>=0.34,<0.40",
  "pydantic>=2.7,<2.13",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.18,<0.0.23",
  "PyYAML>=6,<7",
  "pypdf==6.19.0",
  "olefile==0.47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<0.29", "playwright>=1.50,<1.59"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "repositories/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
