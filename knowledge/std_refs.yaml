# 표준 문안 참고(std_refs) — 공개 표준계약 문서의 조항 발췌를 check에 매핑.
#
# 용도(사용자 결정 프레임 — .omc/research/std-terms-triage.md):
#   부재알람·검토 카드에 "표준 문서는 이렇게 정하고 있음"을 표시 전용으로 보여줌.
#   가중치·판정(severity)·매칭·골드셋 채점에 일절 관여하지 않음(절대 조건).
#   checks[].sources에 넣지 않는 이유: sources는 법령 근거·verified 검수 체계와
#   결합되어 있어 참고 문안이 섞이면 검증 게이트가 오염됨. 표준 문서는 문서 단위로
#   개정되므로(계약예규 연 1~2회) 이 파일 교체만으로 갱신함.
#
# 스키마: {check_id: [{doc, doc_date, art, quote, source_file}]}
#   - quote: data/std_terms/<source_file> 원문에서 연속 verbatim 발췌(요약·창작 금지).
#     tests/test_std_refs.py가 공백 정규화 substring 대조로 강제함(quote 창작 방지 게이트).
#   - 트리아지 표의 발췌 중 "…"(중략) 표기가 있던 행은 원문 파일과 재대조하여
#     연속 스팬으로 재발췌함.
#
# 문서 약칭:
#   용역   = (계약예규) 용역계약일반조건        [시행 2026-04-30, 계약예규 제149호]
#   물품   = (계약예규) 물품구매(제조)계약일반조건 [시행 2026-04-30, 계약예규 제146호]
#   하도급 = 범용[용역(역무)업 분야] 표준하도급계약서 [공정거래위원회 2024-12-24 제정]

