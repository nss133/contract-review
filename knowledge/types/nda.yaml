meta:
  type_id: nda
  type_name: 정보·비밀보호(NDA·정보제공)
  detect_keywords: [비밀유지, 비밀정보, 영업비밀, 기밀, NDA, 비공개, 비밀보장, 기밀유지협약, 정보제공 계약, 본인확인, 개인정보처리위탁]
  modules:
    - id: M-NDA
      name: 비밀유지 기본
      always_on: true
      screening_question: null
      suggest_keywords: []
checks:
  # ── M-NDA: 영업비밀 요건 (부정경쟁방지 및 영업비밀보호에 관한 법률 제2조 제2호) ──
  - id: NDA-12
    module: M-NDA
    check: 계약 종료 또는 요청 시 비밀정보의 반환·파기 의무가 약정되어 있는가
    label: "반환·파기 의무"
    severity: 참고
    severity_basis: "실무 관행 항목(법령 강제 아님)"
    norm_type: 실무
    basis: practice
    triggers:
      keywords: [반환, 파기, 폐기, 사본, 반납, 파기확인서, 증빙, 파기 사실 확인]
    absence_check: true
    sources: []
    note: 종료 또는 요청 등 계약에서 정한 사유에 따라 비밀정보를 반환·파기하는 의무를 확인한다. 파기확인서 등 증빙 방식은 약정된 경우 함께 읽되 반드시 같은 양식의 증빙을 요구하지 않는다. 실제 반환·파기 완료는 확인하지 않는다.
  # NDA-13 통합 제거(2026-07-29 지식 다이어트) — 반환·파기 의무의 증빙 절차를 NDA-12로 통합(triage §3 G5 참조)
    active: true
    disposition: reword
    meaning_revision: 1.88.1
    judgment_level: presence
    judgment_scope: module
    decision_question: 계약 종료 또는 요청 시 비밀정보의 반환·파기 의무가 약정되어 있는가?
    pass_guidance: 이 질문의 약정 내용이 확인되고 구체적인 반대 내용이 없는 경우
    opinion_guidance: 본건에서 확인된 구체적인 문제와 근거를 작성
    checklist_revision: content-v3

  # ── M-NDA: 침해 시 구제 (영업비밀보호법 제10조~제14조의4) ──
  - id: NDA-14
    module: M-NDA
    check: 법정 구제수단(침해금지·예방청구, 손해액 추정, 징벌적 배상, 신용회복조치, 비밀유지명령)을 제한·배제하는 문언이 없는가
    label: "법정 구제수단 보전"
    severity: 권장
    severity_basis: "근거 조문이 임의규정임 — 부정경쟁방지 및 영업비밀보호에 관한 법률 제10조"
    norm_type: 임의
    basis: statute
    triggers:
      keywords: [금지청구, 침해금지, 예방, 가처분, 침해행위의 금지, 손해액 추정, 이익액, 징벌적, 5배, 배액, 신용회복, 신용 실추, 비밀유지명령, 열람 제한]
    absence_check: false
    sources:
      - law: 부정경쟁방지 및 영업비밀보호에 관한 법률
        article: 제10조
        clause: 제1항
        quote: '영업비밀의 보유자는 영업비밀 침해행위를 하거나 하려는 자에 대하여 그 행위에 의하여 영업상의 이익이 침해되거나 침해될 우려가 있는 경우에는 법원에 그 행위의 금지 또는 예방을 청구할 수 있다'
        verified: true
        source_type: law
      - law: 부정경쟁방지 및 영업비밀보호에 관한 법률
        article: 제14조의2
        clause: 제2항
        quote: '영업상의 이익을 침해한 자가 그 침해행위에 의하여 이익을 받은 것이 있으면 그 이익액을 영업상의 이익을 침해당한 자의 손해액으로 추정한다'
        verified: true
        source_type: law
      - law: 부정경쟁방지 및 영업비밀보호에 관한 법률
        article: 제14조의2
        clause: 제6항
        quote: '영업비밀 침해행위가 고의적인 것으로 인정되는 경우에는 제5조 또는 제11조에도 불구하고 제1항부터 제5항까지의 규정에 따라 손해로 인정된 금액의 5배를 넘지 아니하는 범위에서 배상액을 정할 수 있다'
        verified: true
        source_type: law
      - law: 부정경쟁방지 및 영업비밀보호에 관한 법률
        article: 제12조
        quote: '영업비밀 보유자의 청구에 의하여 제11조에 따른 손해배상을 갈음하거나 손해배상과 함께 영업상의 신용을 회복하는 데에 필요한 조치를 명할 수 있다'
        verified: true
        source_type: law
      - law: 부정경쟁방지 및 영업비밀보호에 관한 법률
        article: 제14조의4
        clause: 제1항
        quote: '해당 소송의 계속적인 수행 외의 목적으로 사용하거나 그 영업비밀에 관계된 이 항에 따른 명령을 받은 자 외의 자에게 공개하지 아니할 것을 명할 수 있다'
        verified: true
        source_type: law
    note: 법정 구제권 5종(§10 금지·예방청구, §14조의2② 손해액 추정, §14조의2⑥ 5배 징벌배상, §12 신용회복, §14조의4 비밀유지명령) — 계약서에서 판정할 실질은 '배제 조항 유무' 하나. NDA-16·17·18·19 통합(2026-07-29 지식 다이어트, 각 근거는 sources 병기)
    active: true
    disposition: keep
    meaning_revision: 1.87.0
    judgment_level: appropriateness
    judgment_scope: module
  - id: NDA-15
    module: M-NDA
    check: 비밀정보(영업비밀) 침해로 인한 손해배상책임 조항이 있는가
    label: "영업비밀 손해배상"
    severity: 필수
    severity_basis: "근거 조문이 강행규정(의무)임 — 부정경쟁방지 및 영업비밀보호에 관한 법률 제11조"
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [손해배상, 배상 책임, 손해를 배상, 배상하여야]
    absence_check: true
    sources:
      - law: 부정경쟁방지 및 영업비밀보호에 관한 법률
        article: 제11조
        quote: '고의 또는 과실에 의한 영업비밀 침해행위로 영업비밀 보유자의 영업상 이익을 침해하여 손해를 입힌 자는 그 손해를 배상할 책임을 진다'
        verified: true
        source_type: law
  # NDA-16·17·18·19 통합 제거(2026-07-29 지식 다이어트) — "~가 배제되지 않는가"형 법정효과 안내 체크 4건을 NDA-14(법정 구제수단 보전)로 통합, 각 조문 근거는 NDA-14 sources 병기(triage §3 G6 참조)
  # NDA-20 통합 제거(2026-07-29 지식 다이어트) — 위약벌·손해배상예정 존재확인은 공통 RISK-06(편면성)과 같은 조항 한 판정(cos 0.459), RISK-06 문안에 병기(triage §3 G7 참조)
    active: false
    disposition: merge
    meaning_revision: 1.88.1
    judgment_level: presence
    judgment_scope: module
    successor: CNS-DAMAGE
