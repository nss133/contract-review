meta:
  type_id: investment
  type_name: 투자
  detect_keywords: [투자, 펀드, 사모펀드, 집합투자, 수익증권, 출자, 조합, 투자신탁, 투자일임, 신탁계약, capital call, 캐피탈콜, Capital Call, 변액펀드, 블라인드, PEF, 메자닌, 리츠, ISDA, CSA, 장외파생, 증거금]
  # 성격 배타 게이트(A3, settlement→shareholders 선례와 동일 구조): 신탁계약서는 신탁법상
  # 당사자를 "위탁자/수탁자"로 명명하는 것이 표준 용례인데, 이 어휘가 outsourcing.yaml의
  # 핵심 키워드(위탁/수탁)와 문자열 충돌해 outsourcing으로 오분류됨(사내표준층 케이스18 회귀).
  # 신탁 강신호가 복수 검출되면 outsourcing 점수를 억제.
  #
  # ⚠️ 2026-08-04 교정(11차): 신호에 "위탁자·수탁자"가 들어 있어 게이트가 과잉 발동했음 —
  # 이 둘은 신탁 전용어가 아니라 업무위탁계약의 표준 당사자 호칭이기도 해서, 전형적
  # 업무위탁계약서("위탁자는 수탁자에게 콜센터 업무를 위탁한다")조차 outsourcing 점수가 0으로
  # 눌려 유형 미확정이 되는 잠복 버그가 있었음(변경합의서 케이스 추가 중 발견).
  # 신호는 신탁에만 나타나는 어휘로 한정 — 공유 어휘는 판별 신호가 될 수 없음.
  nature_signals: [신탁계약, 신탁재산, 신탁업자, 수익증권, 집합투자업자, 신탁원본, 수익자총회]
  suppresses: [outsourcing]
  modules:
    - id: M-FUND
      name: 집합투자·펀드
      always_on: true
      screening_question: 펀드(집합투자기구)에 대한 투자·출자를 내용으로 하는가?
      suggest_keywords: [펀드, 집합투자, 수익증권, 사모, 투자신탁]
    - id: M-MANDATE
      name: 투자일임·자산운용위탁
      always_on: false
      screening_question: 자산운용사에 투자일임(운용 위탁)을 맡기는가?
      suggest_keywords: [투자일임, 일임, 운용 위탁, 변액펀드]
    - id: M-PARTNER
      name: 출자·조합(LP/GP)
      always_on: false
      screening_question: 조합(합자조합 등)에 유한책임사원(LP)으로 출자하는가?
      suggest_keywords: [출자, 조합, LP, 업무집행조합원, capital call, 캐피탈콜]
    # 수익자 국면 전용(11차) — 당사가 투자신탁에 수익자로 참여할 때, 신탁계약(및 그 변경합의서)이
    # 수익자에게 불리하지 않은지를 보는 관점. 준수주체는 집합투자업자·신탁업자이지 당사가 아님.
    - id: M-BENEF
      name: 수익자 지위·보호
      always_on: false
      screening_question: 당사가 투자신탁의 수익자로서 신탁계약(또는 그 변경)을 검토하는가?
      suggest_keywords: [수익자, 수익증권, 수익권, 집합투자규약, 투자신탁, 수익자총회]
      requires_stance: [beneficiary]
checks:
  # ── M-FUND 집합투자·펀드 ─────────────────────────────────────
  - id: INV-FUND-01
    check: 투자 대상 집합투자기구(펀드)의 형태·집합투자규약(신탁계약·정관·조합계약)이 특정되어 있는가
    label: "펀드 형태·규약 특정"
    module: M-FUND
    severity: 참고
    severity_basis: 선언규정 — 자본시장법 제9조 제18항·제22항(집합투자기구 형태·집합투자규약 정의)
    norm_type: 선언
    basis: statute
    triggers:
      keywords: [집합투자기구, 펀드, 투자신탁, 집합투자규약, 신탁계약]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제9조
        clause: 제18항
        quote: 집합투자를 수행하기 위한 기구로서 다음 각 호의 것을 말한다
        verified: true
        source_type: law
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제9조
        clause: 제22항
        quote: 집합투자기구의 조직, 운영 및 투자자의 권리ㆍ의무를 정한 것으로서 투자신탁의 신탁계약, 투자회사ㆍ투자유한회사ㆍ투자합자회사ㆍ투자유한책임회사의 정관 및 투자합자조합ㆍ투자익명조합의 조합계약을 말한다
        verified: true
        source_type: law
    note: "제9조 제22항 quote — 2026-07-28 축약 오인용 발견으로 현행 원문 교체·검수 하향 — 재검수 필요"
  - id: INV-FUND-02
    check: 사모집합투자기구인 경우 사모 요건(투자자 총수 제한 등)에 부합하는가
    label: "사모 요건 부합"
    module: M-FUND
    severity: 권장
    severity_basis: 선언규정이나 위반 시 규제 — 자본시장법 제9조 제19항(사모집합투자기구 투자자 100인 이하)
    norm_type: 선언
    severity_override: true
    basis: statute
    triggers:
      keywords: [사모, 사모펀드, 사모집합투자]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제9조
        clause: 제19항
        quote: 집합투자증권을 사모로만 발행하는 집합투자기구
        verified: true
        source_type: law
  - id: INV-FUND-03
    check: 운용사(집합투자업자·사모운용사)가 적법하게 등록·인가된 자인가
    label: "운용사 등록·인가"
    module: M-FUND
    severity: 필수
    severity_basis: 강행규정(금지) — 자본시장법 제249조(미등록 사모집합투자업 영위 금지)
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [운용사, 집합투자업자, 사모운용, 등록, 인가]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제249조
        clause: ""
        quote: 일반 사모집합투자업 등록을 하지 아니하고는 일반 사모집합투자업을 영위해서는 아니 된다
        verified: true
        source_type: law

  # ── M-MANDATE 투자일임 ───────────────────────────────────────
  - id: INV-MAN-01
    check: 투자일임업자가 선량한 관리자의 주의로 일임재산을 운용하도록(선관·충실의무) 규정되어 있는가
    label: "투자일임 선관·충실의무"
    module: M-MANDATE
    severity: 필수
    severity_basis: 강행규정(의무) — 자본시장법 제96조(투자일임업자 선관·충실의무)
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [투자일임, 선관, 충실의무, 운용]
    absence_check: true
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제96조
        clause: 제1항
        quote: 투자일임업자는 투자자에 대하여 선량한 관리자의 주의로써 투자일임재산을 운용하여야 한다
        verified: true
        source_type: law
  - id: INV-MAN-02
    check: 이해상충(고유재산 거래·자기이익 도모 등) 불건전 영업행위 금지가 반영되어 있는가
    label: "이해상충 영업행위 금지"
    module: M-MANDATE
    severity: 필수
    severity_basis: 강행규정(금지) — 자본시장법 제98조(투자일임 불건전 영업행위 금지)
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [이해상충, 고유재산, 불건전, 자기거래]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제98조
        clause: 제2항 제6호
        quote: 투자일임재산으로 투자일임업자 또는 그 이해관계인의 고유재산과 거래하는 행위
        verified: true
        source_type: law
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제98조
        clause: 제2항 제4호
        quote: 특정 투자자의 이익을 해하면서 자기 또는 제삼자의 이익을 도모하는 행위
        verified: true
        source_type: law

  # ── M-PARTNER 출자·조합 ──────────────────────────────────────
  - id: INV-PART-01
    check: 조합(합자조합) 출자 시 유한책임사원(LP)의 책임이 출자가액 한도로 제한되는가
    label: "LP 유한책임 제한"
    module: M-PARTNER
    severity: 필수
    severity_basis: 선언규정(책임 한정) — 상법 제86조의2(유한책임조합원은 출자가액 한도 책임)
    norm_type: 선언
    severity_override: true
    basis: statute
    triggers:
      keywords: [합자조합, 유한책임, 출자가액, LP, 조합원]
    absence_check: false
    sources:
      - law: 상법
        article: 제86조의2
        clause: ""
        quote: 출자가액을 한도로 하여 유한책임을 지는 조합원이 상호출자하여 공동사업을 경영할 것을 약정
        verified: true
        source_type: law
  - id: INV-PART-02
    check: 추가출자(Capital Call) 요구의 요건·한도·불이행 효과가 명확한가
    label: "추가출자 요건·효과"
    module: M-PARTNER
    severity: 필수
    severity_basis: "실무 항목이나 출자자(LP) 리스크 직결 — 법령 근거 없음. 리스크: 회사=LP 지위에서 캐피탈콜 요건·한도·디폴트효과 미비 시 예측불가 추가출자 노출 또는 기출자분 몰취 손실 직결(severity_override: risk)"
    norm_type: 실무
    severity_override: true
    basis: practice
    triggers:
      keywords: [capital call, 캐피탈콜, 추가출자, 출자요청, 디폴트]
    absence_check: false
    sources: []

  # ── M-BENEF 수익자 지위·보호 (11차 신설, 수익자 국면 전용) ──────
  # 관점 전환: 아래 항목은 "당사가 지켜야 할 의무"가 아니라 "당사(수익자)가 불리하지 않은지"를
  # 확인하는 항목임. 수범자는 집합투자업자·신탁업자이며, 당사는 그 이행을 요구할 지위에 있음.
  - id: INV-BEN-01
    check: 신탁계약 변경이 보수·수수료 인상, 신탁업자 변경, 신탁계약기간 변경 등 수익자총회 결의사항에 해당하는지, 해당한다면 결의를 거쳤는가
    label: "변경 시 수익자총회 결의"
    module: M-BENEF
    severity: 필수
    severity_basis: 강행규정(의무) — 자본시장법 제188조 제2항 후단(수익자 이익 관련 중요사항 변경은 미리 수익자총회 결의)
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [변경, 수익자총회, 보수, 수수료, 신탁업자, 신탁계약기간]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제188조
        clause: 제2항
        quote: 이 경우 신탁계약 중 다음 각 호의 어느 하나에 해당하는 사항을 변경하는 경우에는 미리 제190조제5항 본문에 따른 수익자총회의 결의를 거쳐야 한다
        verified: true
        source_type: law
    note: "2026-08-04 검토 사례(일반사모부동산투자신탁 변경합의서)의 핵심 확인점 — 변경 대상이 §188②각호(보수 인상·신탁업자 변경·기간 변경)에 해당하는지부터 판단"
  - id: INV-BEN-02
    check: 수익자총회 결의를 요하는 변경에 반대할 경우, 수익증권매수청구권(결의일부터 20일 내, 비용 부담 없음)이 보장되어 있는가
    label: "반대수익자 매수청구권"
    module: M-BENEF
    severity: 필수
    severity_basis: 강행규정(권리 보장·비용전가 금지) — 자본시장법 제191조 제1항·제2항(반대수익자의 수익증권매수청구권)
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [매수청구, 반대, 수익증권 매수, 매수를 청구]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제191조
        clause: 제1항 제1호
        quote: 반대(수익자총회 전에 해당 집합투자업자에게 서면으로 그 결의에 반대하는 의사를 통지한 경우로 한정한다)하는 수익자가 그 수익자총회의 결의일부터 20일 이내에 수익증권의 매수를 청구하는 경우
        verified: true
        source_type: law
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제191조
        clause: 제2항
        quote: 해당 수익자에게 수익증권의 매수에 따른 수수료, 그 밖의 비용을 부담시켜서는 아니 된다
        verified: true
        source_type: law
  - id: INV-BEN-03
    check: 집합투자업자의 선관주의·충실의무(투자자 이익 보호)를 배제·완화하는 면책조항이 없는가
    label: "운용사 면책조항 과도 여부"
    module: M-BENEF
    severity: 필수
    severity_basis: 강행규정(의무) — 자본시장법 제79조(집합투자업자의 선관의무·충실의무). 이를 배제하는 약정은 수익자에게 불리
    norm_type: 강행
    basis: statute
    triggers:
      keywords: [면책, 책임을 지지 아니, 선량한 관리자, 충실, 고의 또는 중과실]
    absence_check: false
    sources:
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제79조
        clause: 제1항
        quote: 집합투자업자는 투자자에 대하여 선량한 관리자의 주의로써 집합투자재산을 운용하여야 한다
        verified: true
        source_type: law
      - law: 자본시장과 금융투자업에 관한 법률
        article: 제79조
        clause: 제2항
        quote: 집합투자업자는 투자자의 이익을 보호하기 위하여 해당 업무를 충실하게 수행하여야 한다
        verified: true
        source_type: law
  - id: INV-BEN-04
    check: 신탁계약 변경 시 수익자에 대한 공시·통지 절차가 확보되어 있는가
    label: "변경 공시·통지"
    module: M-BENEF
    severity: 필수
    severity_basis: 강행규정(의무) — 자본시장법 제188조 제3항(변경 시 공시, 총회 결의사항 변경 시 수익자 통지)
    norm_type: 강행
    basis: statute
    triggers:
