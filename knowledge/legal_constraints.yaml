schema_version: "1.0"
rules:
  - id: INS-EVENT-SOLICITATION
    label: 행사대행 계약에 보험모집 행위가 명시됨
    severity: 확인
    route: insurance_solicitation_compliance
    affects_type: false
    summary: 일반 행사 실행용역으로 보기 어려운 보험상품 설명·가입권유 문언이 함께 검출되었습니다.
    reason: 이 신호는 금융업무위탁의 양성 근거로 사용하지 않고, 모집 자격과 대가 지급의 적법성을 별도로 확인합니다.
    requires: [event, solicitation]
    signals:
      event: [행사, 설명회, 세미나, 고객 초청, 대관, 현장 운영, 케이터링]
      solicitation: [보험모집, 보험상품 설명, 가입 권유, 보험가입 권유, 청약 접수, 보험 상담, 보험상담]
    scope_effects:
      financial_outsourcing: non_applicable
    sources:
      - law: 보험업법
        article: 제83조, 제99조
        note: 모집 가능 주체와 무자격자에 대한 모집 위탁·대가 지급 금지 확인

  - id: INS-EVENT-SPECIAL-BENEFIT
    label: 모집 행사에 특별이익 제공 가능성이 명시됨
    severity: 높음
    route: insurance_special_benefit_compliance
    affects_type: false
    summary: 보험모집 문언과 경품·금품·보험료 할인 등 특별이익 신호가 같은 행사 계약에서 검출되었습니다.
    reason: 계약 유형이나 업무위탁 적용 여부를 바꾸는 신호가 아니라, 보험업법상 금지행위 여부를 별도로 확인할 강한 준법경보입니다.
    requires: [event, solicitation, benefit]
    signals:
      event: [행사, 설명회, 세미나, 고객 초청, 대관, 현장 운영, 케이터링]
      solicitation: [보험모집, 보험상품 설명, 가입 권유, 보험가입 권유, 청약 접수, 보험 상담, 보험상담]
      benefit: [경품, 사은품, 금품, 상품권, 포인트, 보험료 대납, 보험료 할인, 수수료 지급]
    supersedes: [INS-EVENT-SOLICITATION]
    scope_effects:
      financial_outsourcing: non_applicable
    sources:
      - law: 보험업법
        article: 제98조
        note: 보험계약 체결·모집 관련 특별이익 제공 또는 제공 약속 금지
      - law: 보험업법 시행령
        article: 제46조
        note: 허용되는 금품의 금액 한도
