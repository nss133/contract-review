schema_version: contract-action-v1
updated: "2026-08-29"
scope: all_absence_checks
policy: >-
  법적 검토가치와 계약 문구 조치를 분리한다. 이 파일은 부재알람 항목 전체의
  계약반영 필요성과 이행 위치를 명시한 사람 검수 정본이며, 미분류 법령 항목은
  계약 필수로 자동 확정하지 않는다.

actions:
  ITCL-01:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: cooperation_control
    action_rationale: 중요도 평가를 회사가 수행하되 제공자의 자료 협조는 계약으로 확보할 필요가 있음
  ITCL-02:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: cooperation_control
    action_rationale: 건전성·안전성 평가는 회사 의무이고 제공자 자료 협조만 계약 통제 대상임
  ITCL-03:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: contract_or_internal_control
    action_rationale: 업무연속성 계획은 내부통제로 수립하되 제공자 역할은 계약으로 뒷받침할 수 있음
  ITCL-05:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: cooperation_control
    action_rationale: 감독보고는 회사 의무이고 기한 준수를 위한 자료·통지 협조가 필요한 항목임
  ITCL-06:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 제공자 지위·재위탁 등 중대 변경을 회사가 적시에 알 수 있는 계약 통제가 필요함
  ITCL-07:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 정보처리시스템 설치 지역은 서비스 제공 조건이므로 계약에서 특정할 필요가 있음
  SH-ANT-01:
    contract_requirement: none
    text_effect: none
    implementation_channel: external_evidence
    action_rationale: 기업결합 신고 판단·신고는 거래 외부의 법정 절차이며 계약문구 부재가 위반요건은 아님

  ITSEC-11:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: cooperation_control
    action_rationale: 재외부주문과 업체 변경을 사전에 통제하려면 상대방을 구속하는 계약 문구가 필요함
  ITSEC-12:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: cooperation_control
    action_rationale: 외주인력 관리의 세부 이행은 운영사항이나 상대방 협조는 계약으로 확보할 필요가 있음

  SOL-01:
    contract_requirement: none
    text_effect: none
    implementation_channel: external_evidence
    action_rationale: 모집자격 등록은 등록부·증빙으로 확인할 사실이며 계약 문구로 창설되지 않음
  SOL-03:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 대외 법정책임과 별개로 당사자 사이 책임배분을 정하는 협상사항임
  SOL-04:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 회사의 대외책임과 수탁자 구상은 구분되며 구상문구는 위험배분상 권고사항임
  SOL-05:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract_or_internal_control
    action_rationale: 교육·점검은 내부 운영으로도 입증 가능하고 필요한 협조 범위만 계약화할 사항임

  PRIV-01:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 처리위탁 법정사항은 주계약 또는 계약의 일부인 처리위탁·보안 특약으로 문서화해야 함
  PRIV-02:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 목적 외 처리 금지는 표준 보안관리약정으로 충족 가능한 법정 문서화 항목임
  PRIV-03:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 기술적·관리적 보호조치는 표준 보안관리약정에서 일괄 확인할 수 있음
  PRIV-04:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 위탁 목적과 범위는 주계약 또는 보안관리약정에서 특정해야 함
  PRIV-05:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 재위탁 제한은 계약의 일부인 보안관리약정으로 충족 가능한 항목임
  PRIV-06:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 접근 제한 등 안전성 조치는 표준 보안관리약정에서 확인할 수 있음
  PRIV-07:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 처리현황 점검·감독 수인 내용은 표준 보안관리약정으로 충족 가능함
  PRIV-08:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 수탁자 위반 책임은 주계약 또는 보안관리약정에 문서화할 항목임
  PRIV-13:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 교육·감독에 대한 수탁자 협조는 표준 보안관리약정에서 확인할 수 있음
  PRIV-14:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 업무범위 초과 이용·제공 금지는 표준 보안관리약정의 핵심 통제임
  PRIV-15:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 개인정보 재위탁 동의는 표준 보안관리약정에서 확인할 수 있음
  PRIV-17:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 개인신용정보 처리위탁 문서화는 PRIV-01~15의 세부 항목과 표준 보안관리약정 적용으로 통합 판단하며 독립 계약수정 항목으로 노출하지 않음
  PRIV-19:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 암호화 등 보호조치는 표준 보안관리약정에서 확인할 수 있음
  PRIV-20:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 교육과 안전처리 내용은 표준 보안관리약정에서 확인할 수 있음
  PRIV-21:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: standard_subdoc
    action_rationale: 개인신용정보 재위탁 제한은 표준 보안관리약정에서 확인할 수 있음

  REL-02:
    contract_requirement: none
    text_effect: none
    implementation_channel: internal_control
    action_rationale: 대주주 거래 이사회 의결은 회사 내부 승인절차이며 계약 기재 자체가 이행요건은 아님
  REL-09:
    contract_requirement: none
    text_effect: none
    implementation_channel: external_evidence
    action_rationale: 계열사 여부는 법인·관계회사 자료로 확인할 사실이며 계약상 자기선언만으로 확정되지 않음

  FIN-SEC-02:
    contract_requirement: none
    text_effect: none
    implementation_channel: external_evidence
    action_rationale: 지명채권 질권의 대항요건은 실제 통지·승낙 증빙으로 확인하며 계약 문구만으로 충족되지 않음
  FIN-SEC-03:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 근저당 계약의 피담보채권과 채권최고액은 담보 범위를 정하는 본질적 문구임
  FIN-SEC-05:
    contract_requirement: none
    text_effect: none
    implementation_channel: external_evidence
    action_rationale: 채권양도 대항요건은 실제 통지·승낙과 확정일자 증빙으로 확인할 사항임
  FIN-SEC-P03:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 근담보 범위의 적정성은 법정 획일사항보다 위험배분·협상 판단에 가까움

  SP-PAY-01:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 하도급대금 지급기일은 서면 기재와 지급기한 준수를 함께 확인할 핵심 조건임
  SP-PAY-11:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 연동 또는 미연동 합의는 해당 거래의 서면에 구체화할 사항임

  CH-01:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 수수료 산정·정산은 법정 획일문구가 아니라 거래조건 협상사항임
  CH-02:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 종료 후 고객관리 책임은 운영방식과 위험배분에 따라 정할 협상사항임
  CH-03:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 불완전판매·과태료의 대외책임과 내부 구상은 구분되며 계약상 배분은 협상사항임
  FIN-LOAN-02:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 이자 약정의 내용은 계약조건이지만 특정 약정이 반드시 필요한지는 거래구조에 따라 달라짐
  FIN-LOAN-04:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 지연손해금 약정은 법정 기준과 별개로 선택 가능한 위험배분 조항임
  FIN-GUAR-01:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 보증의 효력에 서면과 기명날인·서명이 직접 요구되는 형식요건임
  INV-MAN-03:
    contract_requirement: none
    text_effect: none
    implementation_channel: internal_control
    action_rationale: 일임재산 분별관리·예탁은 운용과 보관의 법정 의무로서 실제 운영·증적을 확인할 사항임
  NDA-15:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 비밀침해 손해배상책임은 법률상 성립 가능하며 별도 문구는 입증·위험배분상 권고임

  CORE-05:
    contract_requirement: none
    text_effect: none
    implementation_channel: internal_control
    action_rationale: 손해사정 수탁자 평가기준의 마련·선정은 회사 내부 승인·운영 절차임
  CORE-06:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 법령준수의무는 법에서 직접 발생하고 포괄 준수문구는 계약상 보강수단임
  CORE-07:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: cooperation_control
    action_rationale: 재위탁 통제의 실효성을 위해 수탁자를 구속하는 사전동의 문구가 필요함
  CORE-09:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 수탁자 위반의 대외책임과 내부 구상은 구분되며 배상·구상 문구는 위험배분 사항임
  CORE-10:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: contract_or_internal_control
    action_rationale: 관리·감독은 회사 의무이나 자료요구·감사 협조는 계약으로 확보할 필요가 있음
  CORE-11:
    contract_requirement: derived
    text_effect: conditional
    implementation_channel: cooperation_control
    action_rationale: 감독보고는 회사 의무이고 개시일정·자료 제공에 대한 수탁자 협조가 필요함
  CORE-13:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: cooperation_control
    action_rationale: 감독당국 조치 시 변경협조 문구는 대응 편의를 위한 권고사항임
  CORE-14:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: cooperation_control
    action_rationale: 감독기관 검사·자료제출 협조는 실무상 유용하나 모든 계약의 획일적 필수문구는 아님

  SP-DEL-02:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 지체상금은 법정 손해배상과 별개로 손해액을 예정하는 선택적 위험배분 조항임
  SP-DEL-05:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 도급 하자구제는 법정 규율이 존재하며 세부 문구는 거래상 필요에 따른 협상사항임
  SP-DEL-12:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 위임형 선관주의·구제는 법정 의무를 계약에서 구체화하는 선택사항임
  SP-DEL-09:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 매매 하자담보의 세부 조정은 법정 규율을 전제로 회사 유불리를 보고 정할 협의사항임
  ITDL-06:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: SLA와 장애 보상은 서비스 위험을 배분하는 실무 협상사항임

  SETTLE-01:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 화해 대상 분쟁의 특정은 합의 범위와 효력을 정하는 본질적 문구임
  SETTLE-02:
    contract_requirement: express
    text_effect: required_present
    implementation_channel: contract
    action_rationale: 상호 양보 내용은 화해의 성립과 효력 범위를 정하는 본질적 문구임
  SETTLE-05:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 부제소 합의의 범위는 유효성 위험을 줄이기 위한 협상·명확화 사항임
  SETTLE-07:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 화해금 지급조건은 거래 이행을 위한 중요 조건이나 법정 획일문구는 아님

  SH-SHARE-01:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract_or_internal_control
    action_rationale: 정관상 승인과 계약상 양도제한은 효력 층위가 달라 정관 확인과 협상이 함께 필요함
  SH-SHARE-05:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 우선매수권은 법정 기본권이 아니라 당사자 협상으로 창설하는 권리임
  SH-SHARE-06:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 동반매도참여권은 소수주주 보호를 위해 선택적으로 설계하는 계약상 권리임
  SH-SHARE-07:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 동반매도청구권은 지배주주 회수구조에 따라 선택적으로 설계하는 계약상 권리임
  SH-SHARE-08:
    contract_requirement: none
    text_effect: none
    implementation_channel: external_evidence
    action_rationale: 주권 교부·명의개서는 실제 이행과 회사 장부 증빙으로 확인할 사항임
  SH-GOV-04:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 법정 열람권을 넘는 정보접근권은 투자조건에 따라 회사 유불리를 보고 정할 협의사항임
  SH-FIN-01:
    contract_requirement: none
    text_effect: none
    implementation_channel: statutory_duty
    action_rationale: 주주의 신주인수권은 법률에서 직접 발생하며 계약문구 부재만으로 권리가 사라지지 않음

  # ── 전수 부재점검 명시분류 — v1.47.0 ──
  CMN-01:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
    action_rationale: 당사자 표시는 분쟁 예방을 위한 기본 명확화 사항이나 모든 계약의 획일적 법정문구는 아님
  CMN-02:
    contract_requirement: recommended
    text_effect: advisory
    implementation_channel: contract
