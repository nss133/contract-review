# 13차 잔여 오탐 게이트 반대면: 법률 쟁점의 핵심 문언이 있는 조항은 계속 노출한다.
id: corpus-semantic-positive
desc: 위험부담·하자구제·하자기간·완전물·SLA 진성 근거 보존
force_type: procurement
force_active_modules: [M-DELIVERY]
shown_must_include: [SP-DEL-03, SP-DEL-05, SP-DEL-07, SP-DEL-08, SP-DEL-10, ITDL-06]
text: |
  시스템 납품계약서

  제1조(위험부담) 인도 전 쌍방의 책임 없는 사유로 목적물이 멸실 또는 훼손된 경우 을은 대금을 청구하지 못한다.
  제2조(하자보수) 완성물에 하자가 있으면 갑은 상당한 기간을 정하여 보수·수정 또는 재수행을 요구할 수 있다.
  제3조(하자와 해제) 하자로 계약의 목적을 달성할 수 없는 경우 갑은 계약을 해제할 수 있다.
  제4조(하자담보 기간) 하자담보 존속기간은 검수완료 후 1년이며 무상 하자보수와 유상 유지보수를 구분한다.
  제5조(완전물 급부) 납품 물품에 하자가 있으면 갑은 하자 없는 대체물의 재납품을 청구할 수 있다.
  제6조(서비스수준·SLA·장애 대응·보상) 서비스수준(SLA)과 가동률을 준수하고 장애 발생 시 복구·대응하며 손해배상 또는 요금 감액으로 보상한다.
