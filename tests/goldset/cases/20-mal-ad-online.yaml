text: "\n\n\n\n온라인 광고 계약서\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n미래에셋생명보험\
  \ 주식회사                            OOOOO\n\n\nOOOOO (이하 “제휴사” 이라 한다)와 미래에셋생명보험 주식회사\
  \ (이하 “미래에셋생명\"이라 한다)는 상호신뢰를 바탕으로 다음과 같이 온라인 광고 계약(이하“본 계약”이라 한다)을 체결한다.\n\n제 1\
  \ 조 [계약의 목적]\n본 계약은 “제휴사”가 운영하는 웹, 모바일 서비스를 활용하여 “미래에셋생명” 상품 및 서비스를 광고(이하 “광고”라\
  \ 한다)함에 있어 상호 공동 이익을 증진시키는 것을 목적으로 한다. \n\n제 2 조 [선관주의 및 협조의무]\n\t•\t“미래에셋생명”과 “제휴사”\
  \ (이하 통칭하여 “양 당사자”라 한다)는 본 계약이 공동의 이익을 위한 것임을 상호 인식하고, 선량한 관리자의 의무를 다하며, 신의와 성실의\
  \ 원칙에 따라 상호 협조하여 본 계약을 성실히 이행하도록 한다.\n\t•\t“미래에셋생명”은 과대•허위 광고, 저작권 침해 광고, 정부 기관의\
  \ 심의, 인증 및 법적 절차를 위반한 광고로 인하여 “제휴사” 및 광고매체의 명예가 훼손되거나 제3자 또는 감독기관으로부터 민원제기, 제재 처분\
  \ 등이 내려지는 경우 손해배상책임, 제재 처분 이행을 포함한 모든 책임을 부담하도록 한다. \n\n제 3 조 [법규준수]\n양 당사자는 본 계약과\
  \ 관련해 「보험업법」, 「독점규제 및 공정거래에 관한 법률」, 「개인정보 보호법」, 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」, 「신용정보의\
  \ 이용 및 보호에 관한 법률」, 「금융소비자 보호에 관한 법률」 등 관련 법령 및 규정을 준수하며 본 계약의 내용이나 조항이 관계법규나 감독기관의\
  \ 해석에 위배될 경우 해당되는 부분에 한해 그 내용을 무효로 하고, 법규 등에 부합되는 내용으로 협의, 조정한다.\n\n제 4 조 [각 당사자\
  \ 의무]\n\t•\t“미래에셋생명”은 다음 각 호의 의무를 다하여야 한다.\n\t•\t“제휴사”가 “광고”할 상품에 대한 선정 및 광고물의 제공\n\
  \t•\t광고물에 대한 기관의 심의, 인증 및 법적 절차, 저작권 등의 준수\n\t•\t“제휴사”의 서비스 이용 고객이 “미래에셋생명”의 상품을\
  \ 조회/가입할 수 있는 경로 제공\n\t•\t“제휴사”의 “미래에셋생명” 광고에 따른 광고비를 “제휴사”에 지급\n\t•\t기타 상호 성과 증진을\
  \ 위한 노력\n\t•\t“제휴사”는 다음 각 호의 의무를 다하여야 한다.\n\t•\t“미래에셋생명”의 상품을 “제휴사”의 웹, 모바일, 앱 플랫폼\
  \ 내 노출하여 광고\n\t•\t“미래에셋생명”이 제공하는 광고/홍보물에 대한 광고 배너 이미지 관리 지원\n\t•\t기타 상호 성과 증진을 위한\
  \ 노력\n\n제 5 조 [계약 기간]\n본 계약의 계약기간은 20  년   월   일부터 20  년   월   일까지로 한다. 단, 계약기간\
  \ 만료 1개월 전까지 “미래에셋생명” 또는 “제휴사”이 상대방에게 별도의 서면에 의한 의사표시를 하지 않는 한 본 계약은 [  ]년단위로 동일한\
  \ 조건으로 자동 연장된다.\n\n제 6 조 [광고비 지급]\n“미래에셋생명”은 광고집행의 대가로서, “광고비 지급 협약서”의 지급기준 및 절차에\
  \ 따라 “제휴사”에 광고비를 지급한다. \n\n제 7 조 [계약의 변경]\n양 당사자는 계약 내용의 변경이 필요한 경우 상호 서면 합의 하에\
  \ 본 계약의 내용을 변경할 수 있다. \n\n제 8 조 [계약 해지 또는 해제]\n\t•\t양 당사자 중 일방에게 다음 각 호의 어느 하나에\
  \ 해당하는 사유가 발생한 경우에는 상대방은 그 일방에 대하여 계약기간 중이라도 서면으로 본 계약을 즉시 해지 또는 해제할 수 있다.\n\t•\t\
  본 계약의 협조 내지 준수사항, 의무이행 등을 현저히 태만하거나 지연하여 상대방의 영업활동에 지장을 초래한 경우\n\t•\t주요재산에 강제집행이\
  \ 개시되거나 부도처리, 회생절차, 파산 등의 개시신청으로 더 이상의 계약유지가 곤란할 경우\n\t•\t어느 당사자에게 부도, 지급불능, 기타\
  \ 이에 준하는 사유가 발생하여 합리적으로 보아 본 계약을 이행하기 곤란하다고 판단되는 경우\n\t•\t일방의 고의 또는 과실로 인하여 상대방에게\
  \ 손해가 발생한 경우\n\t•\t일방이 본 계약을 위반하고 그 시정을 요구하는 상대방의 통지를 받은 날로부터 1주일이내에 해당 위반사항을 시정하지\
  \ 않는 경우\n\t•\t기타 본 계약을 수행하기 어려운 중대한 사유가 발생한 경우\n\t•\t본 조에 의하여 본 계약이 해지 또는 해제된 경우에\
  \ 당사자 일방의 상대방에 대한 모든 채무는 기한의 이익을 상실하며 해지 또는 해제일에 그 이행기가 도래한 것으로 본다.\n\t•\t본 조에 의한\
  \ 본 계약의 해지 또는 해제는 해지 또는 해제 이전에 발생된 양 당사자간의 권리, 의무 또는 본 계약상의 손해배상청구권에 영향을 미치지 아니한다.\n\
  \t•\t제1항에도 불구하고 양 당사자는 언제든지 서면에 의한 합의로써 본 계약을 해지 또는 해제 할 수 있다.\n\n제 9 조 [계약의 해석]\n\
  \t•\t본 계약 해석에 관하여 의문이 있을 경우에는 양 당사자가 협의하여 원만한 해결을 위해 상호 노력하여야 한다.\n\t•\t전항에서 원만한\
  \ 해결이 이루어지지 않을 경우에는 관계법규 및 상관례에 따른다.\n\n제 10 조 [비밀유지]\n\t•\t양 당사자는 본 계약의 원만한 이행을\
  \ 위하여 영업관련 정보를 제공할 수 있으며, 영업 관련 정보는 본 계약의 목적에 한해서만 사용하여야 하고, 이러한 정보를 제공받은 상대방은 정보제공자의\
  \ 사전 서면 동의 없이 해당 정보가 제3자에게 누출되지 않도록 비밀유지 의무를 부담한다.\n\t•\t일방의 고의 또는 과실로 본 조에 따른 비밀유지\
  \ 의무를 위반하여 상대방에 손해가 발생한 경우에는 해당 손해의 원인을 제공한 측에서 책임을 지고 그 손해를 배상한다.\n\t•\t계약이 종료된\
  \ 이후에도 본 조의 비밀유지의무는 지속된다.\n\n제 11 조 [준수의무]\n\t•\t양 당사자는 주소, 상호, 대표자, 연락처에 변경이 있는\
  \ 경우 지체 없이 그 내용을 상대방에게 서면으로 통지하여야 하며, 이를 지연 또는 누락하여 발생하는 모든 문제에 대해 그 변경통지를 게을리한\
  \ 당사자가 책임을 진다.\n\t•\t양 당사자는 임직원 및 기타 본 계약과 관련한 업무를 수행하는 자에게 본 계약을 이행하는데 필요한 충분한\
  \ 교육을 실시하여야 한다.\n\n제 12 조 (저작권 등의 귀속)\n\t•\t“미래에셋생명”은 본 계약에 따라 “제휴사”에게 전달한 광고물 등\
  \ 일체의 자료(이하 “광고물 등”이라 한다)에 대해 포괄적이고 배타적인 저작권 및 저작인접권을 가진다.\n\t•\t“제휴사”는 “미래에셋생명”이\
  \ 제공한 “광고물 등”을 본 계약의 이행 목적 외에는 어떠한 목적으로도 사용할 수 없으며, 이를 위반하여 “미래에셋생명”에게 발생하는 모든 손해에\
  \ 대하여 책임을 진다.\n\t•\t본 계약상 “미래에셋생명”이 제공하는 “광고물등”에 대하여 “미래에셋생명”은 해당 “광고물등”이 제3자의 저작권\
  \ 등 지적재산권을 침해하지 아니함을 보증한다. 만약 제3자의 지적재산권을 침해한 경우 “미래에셋생명”은 관련 분쟁에서 “제휴사”를 면책 및 방어하고\
  \ 모든 손해를 배상해 주어야 한다.\n\n제 13 조 (민원처리 등)\n본 계약의 이행과 관련하여 민원이 발생한 경우 다음 각 호와 같이 해결한다.\n\
  \t•\t일방의 귀책사유로 민원이 발생한 경우 귀책 당사자는 다른 당사자의 협조를 얻어 당해 민원을 해결하여야 하며, 귀책 사유 없는 당사자에게\
  \ 손해가 발생한 경우 이를 배상하여야 한다.\n\t•\t양 당사자 모두의 귀책사유로 민원이 발생한 경우 “제휴사”와 “미래에셋생명”은 상호 협의하여\
  \ 해당 민원을 해결하며, 귀책사유의 크기에 따라 손해를 분담한다.\n\t•\t양 당사자 모두의 귀책사유 없이 민원이 발생한 경우 “제휴사”와\
  \ “미래에셋생명”은 상호 협의하여 해당 민원을 해결한다.\n\n제 14 조 [권리 의무의 양도 금지]\n양 당사자는 상대방의 사전 서면 동의\
  \ 없이 본 계약의 권리 및 의무의 전부 또는 일부를 제3자에게 위탁, 양도 또는 대여, 담보제공 기타 처분할 수 없다.\n\n제 15 조 [손해배상]\n\
  “미래에셋생명” 또는 “제휴사”가 고의 또는 과실로 본 계약의 의무를 이행하지 않거나 본 계약을 위반하여 손해가 발생한 경우에는 상대방이 입은\
  \ 손해를 배상하여야 한다. 다만, 천재지변, 전쟁, 폭동 등 불가항력에 의하여 발생한 경우에는 그러하지 아니하다.\n\n제 16 조 [청렴계약\
  \ 준수]\n\t•\t양 당사자는 계약체결 및 계약이행 과정에서 상대방의 계약관련 임직원에게 직.간접적으로 금품, 향응 등 접대나 부당한 이익을\
  \ 제공하지 아니하며, 필요시 이의 확인을 위한 상대방의 조사에 성실히 응하고 관련 자료를 제출하는 등 적극 협조한다.\n\t•\t양 당사자는\
  \ 계약체결 및 계약이행 과정에서 상대방의 계약관련 임직원에게 금품, 향응 등을 제공하였을 경우에는 입찰제한, 계약해지, 거래 중단 등 어떠한\
  \ 불이익도 감수한다. \n\n제 17 조 [계약 이행의 감독]\n\t•\t“미래에셋생명”은 계약의 적정한 이행을 확보하기 위하여 필요하다고 판단한\
  \ 경우에 업무 이행 사항에 대하여 감독할 수 있으며, 계약상 의무의 일부 또는 전부의 진행이 지연되어 소정의 기한 내에 업무가 수행될 수 없다고\
  \ 인정할 때에는 필요한 조치를 요구할 수 있다.\n\t•\t“제휴사”는 “미래에셋생명”의 감독업무 수행에 협력하여야 하며, “미래에셋생명”은\
  \ 감독업무를 수행함에 있어서 “제휴사”의 업무를 부당하게 방해하여서는 안 된다.\n\n제 18 조 [분쟁해결 및 관할법원]\n“미래에셋생명”과\
  \ “제휴사”는 본 계약과 관련하여 분쟁이 발생할 경우에는 신의성실에 따라 원만히 해결하기 위하여 최선을 다하여야 하며, 소송이 제기될 경우에는\
  \ 당해 분쟁에 관한 재판의 관할은 서울중앙지방법원으로 한다.\n\n“미래에셋생명”과 “제휴사”는 본 계약의 체결 사실 및 내용을 증명하기 위하여\
  \ 계약서 2부를 작성하여 아래와 같이 각각 서명 또는 기명 날인한 후 1부씩 보관한다.\n\n\n\n\n\n20   년    월    일\n\n\
  \n미래에셋생명보험주식회사\t \t\n\n\nOOOOO\n\n (인)\t\t\n                 (인)\n\n\L광고비 지급 협약서\n\
  \nOOOOO(이하 “제휴사”라 한다)와 미래에셋생명보험㈜ (이하 “미래에셋생명”이라 한다)는 양 당사자가 20  년   월   일 체결한 온라인\
  \ 광고 계약서(이하 “기본계약”이라 한다)에 의거하여 아래와 같이 광고비 지급 협약서(이하 “본 부속협약서”라 한다)를 체결한다.\n.\n제\
  \ 1 조 [광고비의 지급]\n\n\t•\t“미래에셋생명”은 “기본계약”에 따라 “제휴사”가 진행한 광고집행에 대한 대가로 “제휴사”에게 본 부속협약서\
  \ 제2조 [광고비 지급 기준]에 따라 산정된 금액을 지급한다. \n\n\t•\t“미래에셋생명”은 광고집행월 [익/익익]월 [  ]일까지 광고비\
  \ 산정 내역을 “제휴사”에 제공한다. “제휴사”은 “미래에셋생명”으로부터 수신한 광고비 산정 내역을 검증 후 [   ]일 이내 세금계산서를 교부함으로써\
  \ “미래에셋생명”에 광고비를 청구한다.\n\n\t•\t“미래에셋생명”은 세금계산서 발행일로부터 [   ]일이내 “제휴사”가 지정하는 예금계좌로\
  \ 광고비를 입금한다.\n\n\t•\t광고비 산정 및 입금 시점은 양사간 협의에 따라 휴무일, 소액 등의 사유로 조정 가능하다.\n \n제 2\
  \ 조 [광고비 지급 기준]\n\n\t•\t“제휴사”가 매체(“제휴사”의 웹, 모바일 플랫폼)를 통해 집행한 광고의 전용 URL(“미래에셋생명”이\
  \ 제공)을 통하여 “미래에셋생명”의 보험가입이 완료된 경우 보험상품의 초회 납입보험료에 납입주기 등에 따른 광고비 지급율을 곱한 금액을 “제휴사”에게\
  \ 광고비로 최초 1회 지급한다. 부가가치세는 [포함/불포함]된 것으로 한다.\L\n\t•\t보험가입의 완료란 고객이 청약과 동시에 초회 보험료를\
  \ 납입하고 “미래에셋생명”이 청약에 승낙한 경우를 말하며, 광고비는 보험가입 완료 후 광고비 산정 시점에 정상 유지되고 있는 계약에 한하여 지급한다\n\
  \n\t•\t보험상품의 광고비 지급율은 상호 협의 후 “미래에셋생명”에서 공문으로 제공한다.\n\n\t•\t“미래에셋생명”과 “제휴사”는 상기\
  \ 제1항과 제2항의 광고비와는 별도로, 추가 마케팅 및 광고 (LMS, EM, 앱푸시, 이벤트, 광고물 게재 광고 등)에 따른 비용을 추가로\
  \ 산정할 수 있다. 이 경우, 양 당사자는 별도의 서면합의(전자메일 및 공문 포함)를 통하여 비용을 지급/수취하기로 한다.\n\n\t•\t광고비\
  \ 산출근거가 되는 실적계산기간은 광고 집행월로 한다.\n\n\t•\t 양사간 제휴 종료시에도 제휴 기간 중 발생한 광고비 지급은 유효하다.\n\
  \ \n제 3 조 [계약 기간 및 효력]\n\t•\t본 부속협약서의 계약기간은 “기본계약”과 동일한 기간으로 한다. \n\t•\t본 부속협약서와\
  \ 기본계약의 내용이 상충될 경우 부속협약서가 우선 적용되며, 부속협약서에 정하지 않은 내용은 기본계약을 따르기로 한다. \n\n“제휴사”과 “미래에셋생명”은\
  \ 본 부속협약이 유효하게 성립하였음을 증명하기 위하여 본 부속협약서를 2통 작성하여 기명 날인한 후 각 1통씩 보관한다.\n\n\n\n\n202\
