# 금융회사 명칭과 '위탁운영'만으로 금융규제상 업무위탁 기본 모듈을 자동 활성하지 않는다.
id: general-event-outsourcing-scope
desc: 단건 행사운영 위탁 — 금융규제 M-CORE 자동 오활성 금지
force_type: outsourcing
active_must_exclude: [M-CORE]
text: |
  임직원 초청 행사 위탁운영 계약서

  미래에셋생명보험 주식회사(위탁사)는 여행사(수탁사)에 단건 행사의 숙박·차량·식사와
  현장 운영을 위탁하고, 수탁사는 일정표와 견적서에 따라 행사를 수행한다.
  계약기간은 행사 정산 완료일까지로 하며 참가자 수에 따라 대금을 정산한다.
