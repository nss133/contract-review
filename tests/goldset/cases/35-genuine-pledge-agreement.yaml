# 게이트의 반대면(11.1차) — 제목 가중이 누락검출을 죽이지 않는지 고정.
# 34번이 "제목이 담보계약이 아니면 담보 체크 금지"를 잠갔다면, 이 케이스는
# "제목이 담보계약이면 담보 체크가 반드시 살아야 함"을 잠근다. 게이트를 넣을 때
# 항상 짝으로 확인해야 하는 축(schema.md "확신 없으면 게이트를 걸지 않음").
# 당사가 질권자이므로 대항요건은 우리가 챙길 사항 — party_roles 게이트도 통과해야 함.
id: genuine-pledge-agreement
desc: 진성 근질권설정계약서 — 담보 체크군 누락검출 유지(제목 가중의 반대면)
detect_expected: finance
# 핵심: 제목이 담보계약이면 X-SEC가 반드시 켜지고, 담보 체크군이 게이트에 막히지 않아야 함.
active_must_include: [X-SEC]
# 담보 체크가 노출 경로에 살아 있는지(대항요건 조항이 실제로 있어 addressed로 잡힘).
# 34번(신탁계약)에서는 같은 체크가 전면 비노출 — 두 케이스가 게이트의 양면을 잠근다.
addressed_must_include: [FIN-SEC-02]
# 참고(11.2차): 이 계약서는 정의부가 한 줄에 "질권자 당사 … 설정자 ○○산업"을 함께 담고 있어
# 지위 판독이 [질권자, 질권설정자, 설정자]로 나오고, 그 결과 담보제공자 관점 P03(최고액 특정)도
# 함께 노출됨. party_roles 게이트는 허용형(OR)이라 지위가 겹치면 양쪽 관점을 모두 보여주는데,
# 법무 체크리스트에서는 "덜 보여주는 것"보다 "더 보여주는 것"이 안전하므로 의도된 동작.
# 서명란처럼 줄이 나뉘면 한쪽만 잡힘(케이스 36에서 확인).
# 참고: 이 계약서에 대항요건 조항을 넣지 않으면 FIN-SEC-02는 consider가 아니라 quiet가 됨 —
# 제1조(목적)에 약하게 매칭돼 tier=review로 잡히고 노출게이트에서 강등되기 때문(HEAD에서도 동일,
# 제목 가중과 무관한 기존 동작). 그래서 이 케이스는 "조항이 있을 때 제대로 잡히는가"로 고정함.
text: |
  예금채권 근질권설정계약서

  질권설정자 ○○산업 주식회사(이하 "설정자")와 질권자 미래에셋생명보험 주식회사
  (이하 "질권자")는 다음과 같이 근질권설정계약을 체결한다.

  제1조 (목적)
  설정자는 설정자가 질권자에 대하여 부담하는 대출금 채무를 담보하기 위하여 설정자가
  제3채무자에 대하여 가지는 예금채권에 근질권을 설정한다.

  제2조 (피담보채무)
  본 계약에 의하여 담보되는 채무는 설정자가 질권자에 대하여 현재 및 장래에 부담하는
  대출원리금 채무로 하고, 채권최고액은 금 일십삼억원으로 한다.

  제3조 (담보목적물)
  담보목적물은 설정자 명의의 ○○은행 정기예금(계좌번호 000-00-0000, 예금액 금 십억원)에
  대한 예금반환채권으로 한다.

  제4조 (대항요건의 구비)
  설정자는 본 계약 체결 즉시 제3채무자인 ○○은행에게 근질권 설정 사실을 확정일자 있는
  증서로 통지하고, 제3채무자의 승낙을 받아 그 승낙서를 질권자에게 교부하여야 한다.

  제5조 (설정자의 의무)
  설정자는 질권자의 사전 서면동의 없이 담보목적물을 처분하거나 제3자를 위하여 담보로
  제공하여서는 아니 된다.

  제6조 (실행)
  설정자가 피담보채무를 이행하지 아니하는 경우 질권자는 법령이 정하는 바에 따라 근질권을
  실행하여 채권의 변제에 충당할 수 있다.

  설정자: ○○산업 주식회사
  질권자: 미래에셋생명보험 주식회사
