# 실사용 오탐 고정(2026-08-05 사용자 보고) — 신탁계약서의 "질권" 부수 언급.
# 사고: 신탁계약서 제2조가 "수익증권에 질권을 설정하는 경우 전자등록의 방법으로 한다"는
# 방식 규정만 두고 있는데, 이 한 단어로 X-SEC가 켜지고 FIN-SEC-02(채권질권 대항요건)가
# **필수**로 붙음. 실제로 신탁사가 질권자가 되는 구조가 아니므로 대항요건·점유이전은 무의미.
# 고정 대상: ① 제목이 담보계약이 아니면 담보 체크군(FIN-SEC-*) 전면 비노출
#            ② 상대방이 미래에셋 계열 운용사면 수익자 국면이라도 X-RELATED는 가동
#            ③ 수익자 보호 체크는 계속 살아 있을 것
id: trust-pledge-mention-only
desc: 신탁계약서의 질권 부수 언급 — 담보 체크군 오탐 금지 + 계열 상대방 이슈 가동
detect_expected: investment
stance_expected: beneficiary
consider_must_exclude_prefix: [FIN-SEC-]
addressed_must_exclude: [FIN-SEC-01, FIN-SEC-02, FIN-SEC-03, FIN-SEC-05]
# 상대방이 미래에셋자산운용 → 계열사 이슈 검토 가동(사용자 지시)
active_must_include: [X-RELATED]
text: |
  미래에셋맵스일반사모부동산투자신탁제7호 신탁계약 변경합의서

  집합투자업자 미래에셋자산운용 주식회사(이하 "집합투자업자")와 신탁업자 ○○은행 주식회사
  (이하 "신탁업자")는 본 투자신탁의 신탁계약을 다음과 같이 변경하기로 합의한다.

  제1조 (목적)
  본 합의서는 원 신탁계약 제20조의 보수에 관한 사항을 변경하기 위한 것이다.

  제2조 (수익증권의 양도 및 질권 설정)
  ① 수익증권을 양도하는 경우에는 전자등록의 방법으로 하여야 한다.
  ② 수익증권에 질권을 설정하는 경우에도 전자등록의 방법으로 하여야 한다.

  제3조 (보수의 변경)
  집합투자업자 보수를 연 0.5퍼센트에서 연 0.7퍼센트로 변경한다. 보수는 매일 신탁재산의
  순자산총액에 보수율을 곱하여 계산하며 매 3개월 후급으로 지급한다.

  제4조 (수익자총회)
  ① 본 합의서에 따른 변경은 자본시장과 금융투자업에 관한 법률 제188조 제2항에 따라
  수익자총회의 결의를 거쳐 효력이 발생한다.
  ② 집합투자업자는 결의에 반대하는 수익자에게 수익증권매수청구권을 보장한다.
  ③ 집합투자업자는 변경 내용을 인터넷 홈페이지에 공시하고 수익자에게 통지한다.

  제5조 (효력발생일)
  본 합의서는 수익자총회의 결의일에 효력이 발생한다.

  집합투자업자: 미래에셋자산운용 주식회사
  신탁업자: ○○은행 주식회사
  수익자: 미래에셋생명보험 주식회사
