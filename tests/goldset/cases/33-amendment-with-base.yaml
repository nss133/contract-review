# 변경합의서 검토 모드 고정(11차, 2026-08-04 사용자 피드백) —
# "기존 계약서가 적법하게 있고 그 변경분을 검토하는 경우, 원계약을 첨부하면 그 내용을 전제로
#  검토하고, 변경내용만 있으면 변경된 내용에 포커스를 둘 것."
# 사고 유형: 변경합의서를 완결된 계약처럼 취급해 원계약에 이미 있는 조항(재위탁 금지·비밀유지)을
# "빠진 항목"으로 알람. 원계약 첨부 시 그 항목은 base_covered로 이탈해야 하고,
# 원계약에도 없는 항목은 알람이 유지되어야 함(누락검출 보존).
id: amendment-with-base
desc: 업무위탁 변경합의서 + 원계약 첨부 — 원계약 커버분 알람 이탈
detect_expected: outsourcing
base_must_cover: [CORE-07, CORE-09]
consider_must_exclude: [CORE-07, CORE-09]
# 원계약에도 없는 항목은 계속 확인 대상으로 남아야 함.
# ⚠️ 11.7차: 이형어 정규화(기밀↔비밀) 도입 후 CORE-06(법령준수)이 원계약 제9조(비밀유지)에
# 매칭되어 base_covered로 이탈함 — 원계약이 실제로 다루므로 정확한 동작. 다른 항목으로 교체.
consider_must_include: [CORE-10]
text: |
  업무위탁계약 변경합의서

  위탁자 미래에셋생명보험 주식회사(이하 "위탁자")와 수탁자 ○○데이터 주식회사(이하 "수탁자")는
  양 당사자 간 2024. 3. 1. 체결한 업무위탁계약(이하 "원계약")의 일부를 다음과 같이 변경하기로
  합의한다.

  제1조 (목적)
  본 합의서는 원계약 제8조에 정한 위탁수수료 및 원계약 제10조에 정한 계약기간을 변경함을
  목적으로 한다.

  제2조 (위탁수수료의 변경)
  원계약 제8조 제1항의 월 위탁수수료를 금 3,000,000원에서 금 5,000,000원으로 변경한다.

  제3조 (계약기간의 변경)
  원계약 제10조 제1항의 계약기간을 2026. 12. 31.까지에서 2028. 12. 31.까지로 연장한다.

  제4조 (기타)
  본 합의서에서 정하지 아니한 사항은 원계약에서 정한 바에 따른다.

  본 합의서 2통을 작성하여 위탁자와 수탁자가 각 1통씩 보관한다.
base_text: |
  업무위탁계약서

  제1조 (목적) 본 계약은 위탁자가 수탁자에게 데이터 처리업무를 위탁함에 관한 사항을 정함을
  목적으로 한다.

  제5조 (재위탁의 제한)
  수탁자는 위탁자의 사전 서면동의 없이 위탁받은 업무의 전부 또는 일부를 제3자에게 재위탁하지
  못한다. 위탁자의 동의를 얻어 재위탁하는 경우에도 수탁자는 재수탁자의 행위에 대하여 위탁자에게
  직접 책임을 진다.

  제8조 (위탁수수료)
  위탁자는 수탁자에게 월 위탁수수료로 금 3,000,000원을 매월 말일까지 지급한다.

  제9조 (비밀유지)
  수탁자는 본 계약의 이행과 관련하여 알게 된 위탁자의 영업비밀 및 고객정보를 제3자에게
  누설하거나 본 계약의 목적 외의 용도로 사용하여서는 아니 된다. 이 의무는 계약 종료 후에도
  존속한다.

  제10조 (계약기간)
  본 계약의 기간은 2024. 3. 1.부터 2026. 12. 31.까지로 한다.

  제11조 (손해배상)
  수탁자가 본 계약을 위반하여 위탁자에게 손해를 발생시킨 경우 수탁자는 그 손해를 배상하여야 한다.

  제14조 (계약의 해지)
  위탁자는 수탁자가 본 계약상 의무를 위반한 경우 서면 통지로써 본 계약을 해지할 수 있다.
