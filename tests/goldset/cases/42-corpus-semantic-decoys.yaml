# 13차 잔여 오탐 회귀: 일반 변경·해지·손해배상 문언을 하자·SLA 쟁점으로 오인하지 않는다.
id: corpus-semantic-decoys
desc: 계약당사자 변경·일반해지·일반손해배상 — 조달 특수쟁점 오부착 금지
force_type: procurement
force_active_modules: [M-DELIVERY]
matched_must_exclude: [SP-DEL-03, SP-DEL-05, SP-DEL-07, SP-DEL-08, SP-DEL-10, ITDL-06]
text: |
  일반 용역계약서

  제1조(계약당사자 변경) 어느 당사자도 상대방의 동의 없이 계약 당사자를 변경할 수 없다.
  제2조(수수료) 갑은 매월 용역 수수료를 을에게 지급한다.
  제3조(일반해지) 당사자 일방이 의무를 위반하면 상대방은 계약을 해지할 수 있다.
  제4조(손해배상) 계약 위반으로 상대방에게 손해가 발생하면 그 손해를 배상한다.
  제5조(목적) 본 계약은 서비스 제공 조건을 정함을 목적으로 한다.
