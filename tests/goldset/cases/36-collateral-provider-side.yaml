# 담보제공자 관점 고정(11.2차, 사용자 요청 2026-08-05) — 빈도는 낮으나 관점이 뒤집히는 국면.
# 35번(진성 근질권설정계약서)은 당사가 **질권자**인 경우로 "대항요건을 갖추었는가"를 보지만,
# 이 케이스는 당사가 **설정자(담보를 제공하는 쪽)**이므로 "제공 조건이 과도하지 않은가"를 봄.
# 같은 담보계약이라도 어느 자리에 있느냐로 체크군이 갈리는 것을 고정한다.
# 특히 제5조에 유질(流質) 약정을 심어 두었음 — 민법 §339 위반 소지로 반드시 표면화되어야 함.
id: collateral-provider-side
desc: 근저당권설정계약(당사=설정자) — 담보제공자 관점 체크 표면화
detect_expected: finance
active_must_include: [X-SEC]
# 담보제공자 관점 항목이 붙어야 함(최고액 특정·구상권·처분제한).
# P01(유질 금지)은 제5조에 매칭되나 coverage=verify로 나옴 — "이 조항을 보라"는 신호이지
# 확정 반영이 아니므로 addressed가 아닌 것이 맞음. 노출 여부는 아래 shown_must_include로 고정.
addressed_must_include: [FIN-SEC-P02, FIN-SEC-P03]
shown_must_include: [FIN-SEC-P01]
text: |
  부동산 근저당권설정계약서

  근저당권설정자 미래에셋생명보험 주식회사(이하 "설정자")와 근저당권자 ○○은행 주식회사
  (이하 "근저당권자")는 다음과 같이 근저당권설정계약을 체결한다.

  제1조 (목적)
  설정자는 채무자 ○○산업 주식회사가 근저당권자에 대하여 부담하는 대출금 채무를 담보하기
  위하여 설정자 소유의 부동산에 근저당권을 설정한다.

  제2조 (채권최고액)
  본 계약에 의하여 담보되는 채권최고액은 금 일십삼억원으로 하고, 피담보채무의 범위는
  채무자가 근저당권자에 대하여 현재 및 장래에 부담하는 대출원리금 채무로 한다.

  제3조 (담보목적물)
  담보목적물은 서울특별시 ○○구 ○○동 000-00 토지 및 그 지상 건물로 한다.

  제4조 (처분제한)
  설정자는 근저당권자의 사전 서면동의 없이 담보목적물을 처분하거나 현상변경하여서는
  아니 되며, 담보목적물에 관하여 제3자를 위한 권리를 설정하여서는 아니 된다.

  제5조 (담보권의 실행)
  채무자가 채무를 이행하지 아니하는 경우 근저당권자는 변제기 전이라도 변제에 갈음하여
  담보목적물의 소유권을 취득하거나 임의로 이를 처분하여 충당할 수 있다.

  제6조 (구상권)
  설정자가 채무자를 대신하여 변제하거나 담보권 실행으로 소유권을 상실한 경우 채무자에
  대하여 구상권을 가진다.

  설정자: 미래에셋생명보험 주식회사
  근저당권자: ○○은행 주식회사
