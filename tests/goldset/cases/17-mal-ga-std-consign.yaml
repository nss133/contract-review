# 사내표준층(3층 골드셋의 2층 확장) — 법무검토 완료 서식이므로 필수 알람은 원칙적으로 0.
# 원문: samples/internal-standards/ 참조. 라벨 확정: 트리아지(2026-07-28) 후.
id: mal-ga-std-consign
desc: 사내표준 개인보험대리점 위탁 — 표준서식 회귀(사내표준층)
detect_expected: channel
# 2026-07-28 사용자 게이트: channel detect_keywords 보강("보험대리점")으로 outsourcing 오분류
# 해소. X-EFIN 신호 정비(금융거래/전자금융 부분문자열 제거)로 ITSEC-01~13 대량 오탐 해소.
# CORE-*(M-CORE 전속)·ITSEC-*(X-EFIN)는 재발 방지 고정. PRIV-05·PRIV-06(재위탁 제한·접근
# 제한, X-PII)·CH-02·CH-03은 channel 정상 감지 후에도 잔존하는 별건 — 라벨하지 않고 알람
# 유지(진성 공백 가능성, 별도 트리아지 필요).
active_must_exclude: [M-CORE, X-EFIN]
text: "[보험회사-보험대리점 표준위탁계약서] \n\n미래에셋생명보험주식회사(이하 “회사”)와 [               ]보험대리점(이하 “대리점”)은\
  \ 다음과 같이 표준위탁계약(이하 “본 계약”이라 한다)을 체결한다. \n\n제 1 장   총   칙\n제1조 (목적) \n본 계약은 회사가 대리점에\
  \ 본 계약에서 정하는 바에 따라 보험 모집, 관리 등의 업무를 위탁하고, 대리점이 해당 위탁업무를 수행함에 있어 대리점의 준수사항, 회사의 수수료\
  \ 지급 및 기타 지원사항 등 회사와 대리점간의 업무위탁관계를 합리적으로 규율하기 위하여 필요한 제반 사항을 규정하는데 목적이 있다.\n\n제2조\
  \ (법규 등 준수) \n① 회사 및 대리점은 상법, 보험업법, 보험업감독규정, 특정 금융거래정보의 보고 및 이용 등에 관한 법률, 개인정보 보호법,\
  \ 신용정보의 이용 및 보호에 관한 법률, 독점규제 및 공정거래에 관한 법률, 부정청탁 및 금품 등 수수 금지에 관한 법률 등 관련 법령 및 감독당국이\
  \ 정한 제규정, 지침 약관, 요율 등을 준수하여야 한다.\n② 대리점은 보험금 청구에 관한 서면이나 증거를 위·변조하는 등 보험금 지급여부 및\
  \ 그 산정에 영향을 미치거나 보험료 납입면제에 영향을 미치는 사항을 거짓으로 알리거나 숨기는 행위(이하“보험사기”)를 포함하여 부당한 보험금\
  \ 청구가 의심될 경우 즉시 회사에 알려야 하며, 직·간접적으로 보험사기에 관여하거나, 보험사기를 야기하도록 조장해서는 아니된다.\n \n제 2\
  \ 장   업무의 위탁 및 수행\n제3조 (위탁업무) \n① 회사는 다음 각 호의 업무를 대리점에 위탁한다\n  1. 보험계약체결의 대리\n \
  \ 2. 보험계약의 유지 및 관리에 필요한 활동\n  3. 보험청약서․보험약관․보험증권의 전달 등 보험계약체결 관련 부수업무\n  4. 보험료의\
  \ 수령(회사가 작성한 영수증을 보험계약자에게 교부하는 경우만 해당)\n  5. 대출의 소개 및 이에 부수하는 업무\n6. 기타 위 각 호의 업무에\
  \ 부수하거나 수반되는 업무\n7. 상기 업무 이외에 대리점의 신청 또는 동의에 의한 추가 위탁 업무 \n② 대리점은 위탁받은 업무 이외에, 청약,\
  \ 고지, 통지, 해지, 취소 등 보험계약에 관한 의사표시를 수령할 수 있는 권한을 가지지 아니하고, 또한 보험계약자에게 보험계약의 체결, 승낙,\
  \ 변경, 해지, 등 보험계약에 관한 의사표시를 할 수 있는 권한도 가지지 아니한다. 다만, 회사가 대리점에 업무를 추가로 위탁한 경우는 그러하지\
  \ 아니한다.\n③ 대리점은 제2항에 관한 사항을 보험계약자에게 안내하여야 한다.\n④ 대리점은 위탁업무를 수행 시 관련법령에 따라 고객확인의무를\
  \ 이행하여야 한다.\n⑤ 대리점의 고의 또는 과실로 위 제4항의 고객확인의무가 제대로 이루어 지지 못하여 회사가 책임을 질 경우 회사는 대리점에게\
  \ 그 손해를 구상할 수 있다. \n⑥ 대리점은 제4항의 고객확인의무 이행시 회사의 고객확인의무 절차를 준수하여야 한다.\n\n제4조 (보험계약의\
  \ 체결)  \n① 대리점은 회사가 정하여 사전에 통지한 기준과 절차에 따라 보험계약 체결을 대리한다.\n② 대리점은 보험계약자, 피보험자 또는\
  \ 수익자 등으로부터 보험계약의 변경, 부활, 해지 등의 요청을 받은 경우 지체 없이 회사에 이를 통보하여야 한다. \n\n제5조 (보험료의 영수\
  \ 및 납입)  \n① 대리점은 계약자가 보험료 납입방법을 선택할 수 있도록 안내하되, 금전사고를 예방하기 위해 계약자에게 자동이체 등을 통해\
  \ 보험료를 납부하도록 권장할 수 있다.\n② 대리점이 보험료를 수령한 때에는 반드시 회사가 정한 양식 및 명의에 따른 영수증을 지체 없이 보험계약자에게\
  \ 교부하여야 한다. \n③ 대리점이 수령한 보험료는 지체 없이 회사가 정한 은행계좌에 입금하거나 회사에 직접 납부하여야 한다.\n\n제6조 (관계정보\
  \ 및 서류의 제출) \n대리점은 위탁업무 수행 과정에서 취득한 보험계약 관련 정보 및 서류 일체를 회사가 정한 서식 및 절차에 따라 회사에 제출하여야\
  \ 한다. \n\n제7조 (광고 및 선전) \n① 대리점은 보험상품에 관하여 광고를 할 때에는 회사에서 정한 절차에 따라 사전승인을 받아야 한다.\
  \ 다만, 보험협회의 광고선전에 관한 규정에 달리 정한 경우에는 그에 따른다.\n② 대리점은 회사의 사전 승인 없이 회사가 취급하는 보험상품에\
  \ 관한 안내 자료를 제작·배포 또는 인터넷 홈페이지에 게재하거나 언론사를 통해 배포하여서는 아니 된다.\n\n제 3 장   수수료의 지급 및\
  \ 반환\n제8조 (수수료의 지급) \n① 회사는 위탁업무 수행에 대한 대가로 대리점에게 수수료를 지급한다. \n② 제1항에 따라 지급하는 수수료의\
  \ 항목, 지급요건, 성적 및 효율 등 산정방법, 지급금액의 산출방법 및 지급금액, 지급기일 등 수수료 지급에 관한 구체적인 사항은 회사가 정한「GA영업제도」에\
  \ 따른다.\n③ 회사 및 대리점은 대리점이 장래 수취할 수수료를 대출의 담보로 활용할 수 없다. \n\n제9조 (수수료 지급기준의 변경) \n\
  ① 회사는 「GA영업제도」를 변경하고자 하는 경우 변경내용을 시행예정일로부터 35일 전에 대리점에게 서면으로 통지하고 동의를 받아야 한다. 다만,\
  \ 다음 각호의 경우에는 그러하지 아니한다.\n   1. 법률 및 규정 등의 변경으로 인하여 기준 변경이 불가피한 경우 또는 단순문구 변경 등\
  \ 실체적 내용이 변경되지 않는 경미한 사항을 변경하는 경우에는 상기 기일과 관계없이 사전통지로 동의를 갈음할 수 있다.\n   2. 기 판매중인\
  \ 보험상품에 적용되던 환산율 변경 및 신상품에 대한 적용 환산율에 대해서는 최소한 적용일 전일까지는 대리점에 안내하도록 한다.\n② 대리점이\
  \ 회사에 대하여 제1항에 따른 시행예정일까지 변경내용에 대해 서면으로 명시적인 부동의 의사를 통지하지 아니한 경우 변경내용에 동의한 것으로 본다.\n\
  \n제10조 (수수료 및 시책 등의 환수)\n① 대리점은 모집한 보험계약의 변경, 무효, 효력상실, 해지, 취소 등으로 인하여 회사가 영수한 보험료의\
  \ 전부 또는 일부를 보험계약자에게 환급하는 경우 당해 보험계약에 관하여 지급받은 수수료 및 시책 등의 전부 또는 일부를 회사에 반환하여야 한다.\n\
  ② 회사는 제1항에 따라 대리점이 반환해야 할 수수료를 익월에 지급할 수수료에서 차감할 수 있다. \n③ 수수료 환수에 대한 사전예고 기간, 환수대상\
  \ 범위, 이의제기 등에 관한 세부적인 내용은 회사와 대리점의 협의에 따라 정하되, 최소 사전예고기간은 수수료 환수일 이전 2일 이상(영업일 기준)으로\
  \ 한다.\n④ 회사는 대리점이 제3항의 절차에 따라 수수료 환수에 대하여 이의를 제기한 경우 수수료를 차감없이 우선 지급하고 환수사유가 확정된\
  \ 경우 환수 조치한다. 다만, 환수조치 보류기간은 최대 3개월을 넘지 못한다. \n⑤ 대리점은 수수료의 전부 또는 일부를 회사에 반환하여야 할\
  \ 경우를 위하여, 그 반환채무를 보증하는 이행보증보험 또는 이에 준하는 담보를 회사에 제공해야 한다. \n⑥ 기타 수수료 및 시책 등의 반환에\
  \ 관한 구체적인 사항을 정하기 위해 부속약정서를 정할 수 있다.\n\n\n제 4 장   불공정행위 및 시장교란행위 금지\n제11조 (불공정행위\
  \ 금지) \n회사는 대리점에게 다음 각 호에 해당하는 행위를 하여서는 아니된다\n   1. 본 계약서를 교부하지 않는 행위\n   2. 해지요건\
  \ 이외의 사유로 본 계약을 해지하는 행위\n   3. 정당한 사유 없이 대리점이 요청한 본 계약 해지를 거부하는 행위\n   4. 정당한 사유\
  \ 없이 대리점에게 지급되어야 할 수수료를 지연하여 지급하거나, 지급하지 않는 행위\n   5. 정당한 사유 없이 부실모집을 이유로 대리점에게\
  \ 이미 지급한 수수료의 일부 또는 전부를 환수하는 행위\n   6. 부당하게 설계사 또는 대리점이 될 자의 소개를 요구하면서 이를 이행하지 아니하는\
  \ 경우에 불이익하게 처우하는 행위 다만, 설계사·대리점 영입업무를 위탁받아 별도 계약을 체결한 자에 대해서는 예외로 한다 \n   7. 보험계약\
  \ 체결 또는 유지를 목적으로 보험료의 대납을 강요하는 행위\n   8. 본 계약에서 정한 위탁업무 이외의 업무를 강요하는 행위\n\n제12조\
  \ (부당한 지원 및 거래요청의 금지) \n① 회사는 대리점에 정상적인 거래관행에 비추어 부당하게 수수료, 비용 기타 경제상의 이익을 지원하여서는\
  \ 아니되고, 대리점은 이를 요구하여서는 아니된다.\n② 다음 각 호의 행위를 하는 경우 본조에 따른 부당한 지원 및 거래요청을 한 것으로 본다.\n\
  \   1. 본 계약서에서 정한 수수료 및 시책 등에 대한 지급기준과 합리적인 집행원칙을 위반하여 지원하거나 요청하는 행위\n   2. 본 계약서에\
  \ 명시되지 않은 추가 수수료 또는 실적과 관계없는 시책을 지원하거나 요청하는 행위\n   3. 대리점이 단독으로 기획·운영하는 행사(워크숍,\
  \ 세미나, 연도행사 등)에 필요한 제반비용에 대해 지원하거나 요청하는 행위\n   4. 대리점 자체 운영에 필요한 직원 급여, 소모성 경비(잉크,\
  \ 토너비 등), 집기·비품을 지원하거나 요청하는 행위\n   5. 대리점 사무실 이전에 따른 이사 비용, 대리점 자체 회식에 따른 비용을 지원하거나\
  \ 요청하는 행위\n   6. 대리점에 과도한 보험모집실적을 요청하거나, 대리점이 보험영업 실적에 대한 추가 수수료를 요청하는 행위\n\n제13조\
  \ (시장질서 문란행위 금지) \n① 회사 및 대리점은 보험모집질서 안정을 위해 상호 무분별한 설계사 스카우트 방지를 위해 노력한다.\n② 회사\
  \ 및 대리점은 타 보험회사 및 보험대리점 모집조직을 대량으로 이동시켜 다른 사업자의 사업 활동을 곤란하게 할 정도로 방해하거나, 신규 위촉 설계사에\
  \ 대한 정상적인 거래관행보다 과도한 성과급 지급을 통한 부당한 경쟁을 방지하기 위한 내부통제기준을 마련한다.\n③ 회사 및 대리점은 신규 위촉\
  \ 설계사에 대하여 위촉계약서에 명시된 수수료 이외에 추가로 금전 등을 지급하고자 할 경우 회사 및 대리점의 실정에 맞게 별도 지급기준을 마련하여\
  \ 운영할 수 있다.\n\n\n제 5 장   계약의 갱신, 변경 및 해지\n제14 조 (계약기간) \n① 본 계약의 계약기간은 계약체결일로부터\
  \ 1년으로 한다. \n② 회사 또는 대리점이 본 계약 기간의 만료일로부터 30일 전까지 서면으로 상대방에게 계약조건의 변경이나 갱신거절 등 계약의\
  \ 갱신과 관련한 별도의 의사표시를 하지 아니하는 경우, 본 계약은 1년간 자동 갱신된 것으로 본다. \n\n제15 조 (계약내용의 변경) \n\
  ① 회사는 본 계약서상의 계약내용을 변경할 경우 대리점이 변경내용을 확인할 수 있도록 통지하고 대리점의 동의를 받아야 한다.\n② 회사는 본 계약과\
  \ 관련한 회사의 규정, 지침 등을 변경하고자 할 경우에는 신속히 변경내용을 대리점에게 설명하고 상시 열람할 수 있도록 하여야 한다.\n\n제16\
  \ 조 (계약의 해지) \n① 회사는 다음 각 호에 해당하는 경우 본 계약을 해지할 수 있다. 단, 회사가 본 계약을 해지하는 경우, [30]일\
  \ 전까지 대리점에 서면으로 통보하여야 한다. 단, 제1호 및 제10호의 경우에는 서면통지를 생략할 수 있다.\n   1. 보험업법상 대리점 등록취소\
  \ 사유에 해당되는 경우\n   2. 보험대리점의 모집업무 폐지, 법인의 해산 등의 사유가 발생한 경우 \n   3. 보험대리점이 질병, 출산\
  \ 등 정당한 사유가 있는 경우를 제외하고 3월이상 보험료 실적이 없거나 영업보증금을 납부하지 않는 등 보험영업 의사가 없다고 인정된 때   \n\
  \   4. 보험대리점이 최근 3년내에 감독원장으로부터 3회 이상 경고 등의 처분을 받았을 때\n   5. 회사에 제출한 서류 또는, 위탁업무\
  \ 관련 문서를 위조, 변조하거나, 허위로 작성한 경우\n   6. 본 계약서상 준수사항을 위반한 경우\n   7. 대리점의 보험범죄 및 보험사기\
  \ 행위가 객관적 자료를 통해 명백히 입증되거나, 사법처리로 유죄가 확정되는 경우\n   8. 대리점이 본 계약을 이행하지 아니할 의사를 표시하거나\
  \ 이행할 수 없음이 명백한 경우\n   9. 정당한 사유없이 미환수금액의 상환을 이행하지 않는 경우\n② 대리점은 언제든지 서면에 의해 본 계약의\
  \ 해지를 요청할 수 있다. 다만, 대리점이 본 계약을 해지하는 경우 30일 전까지 회사에 서면으로 통보하여야 한다. \n\n제 6 장   개인정보\
  \ 및 영업비밀의 보호\n제17 조 (개인정보의 보호)\n① 대리점은 위탁업무 과정에서 취득한 고객의 개인정보, 보험계약정보, 금융거래정보, 신용정보\
  \ 등 제반 정보를 정보주체(회사 포함)의 서면 등 관계법률에서 인정하는 동의방식을 통한 의사 표시없이 처리하거나 제3자에게 누설·유출·제공하거나\
  \ 위탁업무 수행 이외의 목적으로 이용하여서는 아니된다.\n② 대리점은 위 제반 정보보호를 위해 인적·물적 시스템 등 보안인프라(전산시스템 등)를\
  \ 구축하여야 한다. \n③ 대리점은 회사의 개인정보보호 가이드라인을 준수하여야 하며, 신용정보의 분실·도난·유출·변조·훼손의 방지 및 안전한\
  \ 신용정보의 처리에 관하여 교육을 실시 하여야 한다.\L\n제18 조 (영업비밀의 보호) \n① 회사 및 대리점은 당사자간 경영, 영업 및 교육\
  \ 관련 제반 정보 및 자료 일체를 당사자간 서면 동의 없이 처리하거나 제3자에게 누설·유출·제공하거나 위탁업무 수행 이외의 목적으로 이용하여서는\
  \ 아니된다.  \n② 대리점은 위탁업무 수행 이외의 목적으로 회사의 상호·상표 등을 사용하거나, 회사로 오인될 수 있는 문구 또는 표현 등을\
  \ 사용하여서는 아니된다.\n\n제 7 장 부정청탁 및 금품 등 제공 금지\n제19 조(대리점의 의무)\n① 대리점은 다음 각 호에 해당하는 행위를\
  \ 하여서는 안된다. \n1. 회사로부터 위탁 받은 업무를 수행함에 있어서 공직자등을 대상으로 직접 또는 제3자를 통하여 부정한 청탁을 하는 행위\n\
  2. 회사로부터 위탁 받은 업무를 수행함에 있어서 공직자등에게 금품을 제공, 약속 또는 제공의 의사표시를 하는 행위\n3. 그 밖에 부정청탁 및\
  \ 금품 등 수수 금지에 관한 법률과 관련하여, 법령∙고시 및 회사의 내부통제기준∙지침 등에서 금지하는 일체의 행위 \n② 대리점이 전항의 의무를\
  \ 준수하지 못하여 회사에 민∙형사적 책임이 부과될 경우, 대리점은 그 책임에 상응하는 손해를 배상하기로 한다.\n\n제 8  장   기   타\n\
  제20 조 (전산비품 등의 제공)\n회사는 전산인프라 등을 지원할 수 있고, 회사가 정한 기준에 따라 이를 회수할 수 있다. 대리점은 회사가 지원한\
  \ 전산인프라 등 비품을 분실하거나 파손한 경우 이를 배상하여야 한다.\n\n제21 조 (통지 및 조치의무) \n대리점은 다음 각 호의 사유가\
  \ 발생한 경우 지체 없이 회사로 통보하여야 하고, 적절한 조치(민·형사상 책임 포함)를 취해야 한다.\n   1. 대리점(임직원, 설계사 포함)이\
  \ 보험의 모집을 함에 있어 보험계약자 등에게 손해를 가한 사실이 있음을 알았을 때\n   2. 대리점(임직원, 설계사 포함)이 위탁업무를 수행함에\
  \ 있어 금전의 유용, 횡령 기타 금전상의 불법행위를 한 경우\n   3. 보험계약자 등으로부터 민원 등이 제기된 경우\n   4. 자금세탁 행위가\
  \ 발생한 경우\n   5. 보험사기 발생 사실을 알았을 때\n   6. 개인(신용)정보 유출 사고가 발생한 경우\n   7. 기타 제1호 내지\
  \ 제6호에 준하는 사유로서 회사와 제3자간에 민·형사상 분쟁의 소지가 있는 경우\n\n제22 조 (손해배상) \n① 본 계약의 당사자 중 일방이\
  \ 본 계약을 위반하는 경우, 상대방 당사자는 그러한 위반으로 입은 제반 손해(법률비용, 분쟁해결비용 등을 포함)의 배상을 청구할 수 있다. \n\
  ② 본조에 따른 의무는 본 계약의 해지 또는 종료 이후에도 존속한다. \n\n제23 조 (재정보증) \n① 대리점은 보험업법 제87조에 따른 영업보증금을\
  \ 회사에 예탁하여야 한다. \n② 회사는 대리점의 불완전판매·불법행위 등으로 인한 손해 및 수수료 반환채무를 담보하기 위하여 제1항에 따른 영업보증금\
  \ 이외에 이행보증금, 보증보험증권, 기타 회사가 인정하는 담보를 추가로 제공할 것을 대리점에 요구할 수 있으며 세부적인 담보설정 방식에 관해서는\
  \ 회사와 대리점간 협의에 따라 정할 수 있다.\n③ 회사는 본조에 따른 영업보증금 또는 담보를 대리점이 본 계약에 따라 회사에 지급할 금액의\
  \ 변제에 전부 또는 일부를 충당할 수 있다. 이 경우 회사는 대리점에 그 뜻을 서면으로 통지하여야 한다. \n④ 대리점이 본조에 따른 영업보증금\
  \ 또는 담보를 회사가 지정하는 시기까지 예탁 또는 제공하지 않을 경우 회사는 대리점이 이를 예탁 또는 제공할 때까지 위탁업무의 수행을 정지시키거나,\
  \ 수수료 지급을 유예할 수 있다. \n⑤ 본 계약이 해지 또는 종료된 경우 회사는 해지일 또는 종료일로부터 3개월 이내에 본조에 따른 영업보증금\
  \ 또는 담보를 대리점에 반환한다. 단, 회사와 대리점이 사전 협의에 따라 반환기간을 달리 정할 수 있다.  \n\n제24 조 (상계 및 제재)\n\
  ① 대리점이 고의 또는 과실로 상법, 보험업법, 보험업감독규정 등 보험업 관련 제반 법규 및 본 계약서상 준수사항을 위반하여 회사에 손해가 발생한\
  \ 경우, 회사는 대리점에 대하여 가지는 손해배상채권을 대리점에 지급할 수수료 등 채권과 상계할 수 있다. \n② 대리점이 고의 또는 과실로 본\
  \ 계약서의 준수사항을 위반한 경우 회사는 경고, 업무정지 등의 조치를 할 수 있다.\n③ 회사는 대리점과 사전에 합의한 ‘보험대리점 평가기준’에\
  \ 따른 평가결과에 따라 해당 대리점의 위탁계약 유지여부를 판단할 수 있다.\n④ 회사는 불완전판매율이 높은 대리점에 대하여 필요한 경우 신규모집위탁을\
  \ 제한할 수 있다.\n\n제25 조 (관련서류의 보관 및 감사)\n① 대리점은 보험업법, 보험업감독규정 및 기타 관련법규에 따라 필요한 제반\
  \ 서류와 장부 등을 작성·보관·비치하여야 한다.\n② 대리점은 불법행위 또는 민원 등의 처리, 위탁업무의 적법한 수행, 보험모집질서의 확립,\
  \ 고객정보 보호, 내부통제현황 점검, 기타 보험계약자의 보호 등을 위하여 회사가 점검·확인을 요구할 경우 이에 적극 협조하여야 한다. \n③\
  \ 대리점은 감독당국 및 관련기관의 검사에 성실히 응하여야 하며, 관련서류의 요구가 있을 때에는 지체없이 제출하여야 한다.\n\n제26 조 (조세관련\
  \ 책임) \n대리점이 회사로부터 지급 받는 수수료, 기타 수입과 관련하여 대리점에 부과되는 일체의 제세공과금은 대리점이 부담한다.\n \n제27\
  \ 조 (법률개정내용의 반영) \n회사 및 대리점은 본 계약서에서 정한 내용이 계약체결 후 제·개정되는 법령과 상충되는 경우에는 본 계약서의 내용을\
  \ 동 법령에 맞도록 변경하여야 하며, 변경된 내용을 준수하여야 한다. \n\n\n제28 조 (관할법원) \n본 계약과 관련된 소송에 대하여는\
  \ 피고의 주소지를 관할하는 법원을 관할법원으로 한다.\n\n제29 조 (본 계약서의 적용시기 및 방법)\n ① 본 계약서는     년    월\
  \   일부터 시행한다. \n ② 회사와 대리점은 본 계약서를 참고하여 회사별 특성에 맞도록 위탁계약서를 수정, 변경 또는 필요한 경우 내용을\
  \ 추가하거나 부속약정서를 체결할 수 있다. 이 경우 부속약정서는 본 계약의 일부로 본다. \n\n제 30조 (부실모집행위에 대한 양정기준)\n\
  \ 회사 및 대리점은 불완전판매 등 부실모집행위에 대해 공정한 양정기준을 마련하여 운영한다. \n\n\n\n20   년    월   일\n\n\n\
  \n\n\n\n회사 [미래에셋생명] 보험주식회사           \n[주소] 서울시 영등포구 국제금융로 56(여의도동, 미래에셋증권빌딩)\n\
  대표이사 황 문 규      (인)               \n\n대리점 [               ]보험대리점\n       [주소] \n\
  \       [대표자]                (서명)\n\n\n\n\n\n\n\n\n   [위탁계약에 대한 부속약정서]   \n\n미래에셋생명보험주식회사(이하“회사”라\
  \ 한다)와 [               ]보험대리점 (이하“대리점”이라 한다)은 회사와 대리점 간에      년    월    일 체결된 위탁계약(서)(이하\
  \ “위탁계약(서)”) 제29 조 제2항에 의거하여 다음과 같이 부속약정서(이하 “본 약정서”)를 체결한다.\n\n제1조 (대리점의 신분 등)\n\
  \ ① 대리점은 독립사업자로서 이 계약에 의하여 회사로부터 위탁받은 업무를 수행한다.\n ② 대리점에게는 회사 직원에게 적용되는 취업규칙 및 제반\
  \ 규정은 적용되지 아니한다.\n\n제 2조 (위탁업무의 범위)\n① 위탁계약서 제 3조 (위탁업무) 제 1항 제 1호 내지 제 6호의 업무는\
  \ 회사와 대리점 간의 위탁계약에서 제외 하기로 하고, 회사와 대리점은 위탁계약서 제 3조 (위탁업무) 제 1항 제7호에 따라 설계매니저에 업무에\
  \ 대하여 별도의 위탁계약을 체결하기로 한다. \n② 제 1항에 따라 회사가 위탁업무에 대하여 지급하는 수수료의 경우 “위탁계약서”의 수수료 관련\
  \ 규정을 따르지 않고 별도로 체결하는 “설계매니저 신분 위촉계약서”에서 정하는 수수료 규정을 따르기로 한다. \n\n제3조 (대리점 민원처리\
  \ 협조)\n① 회사는 대리점의 민원처리에 관해 협조하여야 한다. \n\n제4조 (내용증명물의 수령의제) \n회사 또는 대리점이 위탁계약서상의\
  \ 주소로 내용증명을 발송한 경우, 도달 여부가 확인되면 도달일에 수령한 것으로 보고, 도달 여부가 확인되지 않는 경우에는 해당 내용증명이 반송되지\
  \ 않는 한 발송일로부터 3영업일이 되는 날 수령한 것으로 본다.\n\n제5조 (회사에 의한 공고) \n계약기간의 만료 기타 여하한 이유로 인해\
  \ 회사와 대리점간 위탁계약이 해지된 경우 회사는 계약해지 사실을 신문이나 서신 등을 통하여 보험계약자나 일반대중에게 공고할 수 있다.\n\n\n\
  제6조 (자료제공 요청 등) \n회사는 대리점의 합리적인 자료제공요청에 대해 적극 협조하여야 한다. 다만, 회사의 경영상의 비밀 유지 및 개인정보\
  \ 보호 등을 위해 불가피한 경우에는 예외로 한다.\n\n제7조 (손해보험 관련 특칙)\n손해보험회사와 위탁계약을 체결한 대리점은 「손해보험 공정경쟁\
  \ 질서유지에 관한 상호협정」에 따른 회사의 제반 의무 위반행위가 발생하지 않도록 최대한 협조하여야 한다.\n\n제8조 (계약기간 연장) \n\
  위탁계약서 본문 제17조(계약기간)에도 불구하고 회사별 사정에 따라 대리점과의 위탁계약기간을 1년이상으로 할 수 있다.\n\n제9조 (약정의 유효기간)\
  \ \n본 약정서의 유효기간은 본 약정서 체결일부터 위탁계약이 해지 또는 종료되는 날까지로 한다. 단, 별도의 경과조치규정이 있는 경우 해당 규정을\
  \ 우선 적용한다. \n\n제10조 (기타사항) \n① 대리점은 회사가 개인정보보호법 등 관계 법규에 따라 위탁계약 및 본 약정서에 따른 위탁업무\
  \ 및 대리점의 정보를 공개하는 것에 동의한다.\n② 본 약정서에 정하지 않는 사항은 관계 법규에 따른다.\n\n상기 약정을 체결한 증거로서 본\
  \ 약정서 2매를 작성하여 각자 서명 날인한 후 각각 1매씩을 보관한다.\n\n20    년    월     일\n\n\n\n회사 [미래에셋생명]\
