# 2026-07-28 사용자 게이트: alliance detect_keywords 보강("후원"·"후원계약"·"후원약정")으로
# procurement 오분류 해소 — 재발 방지 고정. SP-DEL-02·SP-DEL-09(M-DELIVERY 전속, alliance
# 재분류 후 모듈 자체 비활성)는 하위파생으로 자동 소멸 확인.
active_must_exclude: [M-DELIVERY]
text: "<포럼, 시상, 박람회용>\n<포럼, 시상, 박람회용>\n\n\n\n\n\n\n\n\n\n\n갑: 미래에셋생명보험㈜\n을: OOOOOOOOOOOO\n\
  \n\n미래에셋생명보험㈜(이하 “갑”이라고 한다)와 [ OOOOOOO](이하 “을”이라고 한다)는 「 OOOOOOOOOO」(이하 “행사(시상)”이라\
  \ 한다)과 관련하여 다음과 같이 후원계약을 약정한다. \n\n제 1 조 (목적)\n본 약정은 “갑”과 “을”이 상기 “행사(시상)”의 성공적인\
  \ 개최와 진행을 위해 각자의 의무 및 조건을 신의와 성실의 원칙에 입각하여 수행함을 목적으로 한다.\n\n제 2 조 (행사(시상)내용)\n가.\
  \ 행사(시상)명 : OOOOOOOOOO\n나. 기간 : 20  년  월  일 ~  20  년   월  일\n다. 행사(시상)내용 : OOOOOOOOOOOOOOOOOOOOOOOOOO\n\
  라. 주 최 : OOOOOOOOOOOOOOOO\n\n제 3 조 (“갑”의 권리와 의무) “갑”은 아래에 명시된 사항을 성실히 시행한다.\n가.\
  \ “갑”은 “을”이 제4조의 후원조건을 성실히 이행하는 것에 대하여 후원금으로 일금 OOOOOO원(\\00,000,000/부가세별도)을 “을”에게\
  \ 지급하도록 한다.\n나. 본 계약 체결 이후 “을”은 “갑”에게 세금계산서로 후원대금을 청구하고 “갑”은 위 후원금액을 후원결과 검수 후 30일\
  \ 이내에 “을”에게 지급한다.\n\n제 4 조 (“을”의 권리와 의무) \n가. OOOOOOOO 포럼(행사)의 경우\n나. OOOOOOOO 시상의\
  \ 경우\n다. OOOOOOOO 박람회의 경우\n* 기타 관련된 세부 사항은 “갑”과 \"을\"이 협의하여 진행한다.\n\n제 5 조 (행사(시상)의\
  \ 변경 및 손해배상)\n가. 천재지변이나 기타 불가항력적 사유로 인하여 본 “행사(시상)”에 변경사항이 발생할 경우에는 \"갑\"과 \"을\"\
  이 상호 협력하여 이를 처리함을 원칙으로 한다.\n\n나. 쌍방중 어느 일방의 귀책 사유로 인하여 발생하는 피해에 대하여는 그 원인을 제공한 측이\
  \ 상대방에 대하여 피해 금액의 범위 내에서 보상한다.\n\n제 6 조 (계약기간)\n본 계약의 계약기간은 본 계약 체결일로부터 본 계약과 관련한\
  \ \"갑“과 \"을\"간의 권리, 의무가 전부 종결된 때까지로 한다. \n\n제 7 조 (계약의 해지)\n①당사자 일방이 본 계약 내용을 이행하지\
  \ 아니할 경우 상대방은 기간을 정하여 그 이행을 서면으로 최고할 수 있으며, 종료일까지 이행하지 아니한 때에는 이행을 최고한 당사자는 본 계약의\
  \ 전부 또는 일부를 즉시 해지할 수 있다. \n② 본 계약의 해지는 해지 이전에 발생된 양 당사자간의 권리, 의무 또는 손해배상청구권에 영향을\
  \ 미치지 아니한다.\n③ 양 당사자는 언제든지 서면에 의한 합의로써 본 계약을 해지할 수 있다.\n\n제 8 조 (양도 및 담보제공금지)\n\
  ①“을”은 본 계약을 제3자에게 양도하거나 담보의 목적으로 제공할 수 없다.\n②“을”은 “갑”의 사전 서면동의 없이는 본 계약상의 의무의 이행에\
  \ 관하여 제 3 자와 하도급계약을 체결할 수 없다.\n\n제 9 조 (비밀 유지 의무)\n본 계약과 관련하여 지득한 영업상 비밀과 관련하여 양\
  \ 당사자는 계약기간 종료 또는 계약 해지 후에도 이를 누설하여서는 아니 된다. 일방 당사자가 이에 위반하여 상대방에게 손해를 발생시킨 경우 이를\
  \ 배상하여야 한다. \n\n제 10 조 (청렴계약)\n“을”은 계약체결 및 계약이행 과정에서 “갑”의 관계 임직원에게 직·간접적으로 부당한 선물,\
  \ 향응이나 이익 등을 제공하지 아니하며, 이를 위반할 경우 계약해지 등 “갑”의 불이익 처분과 관련하여 민·형사상 일체의 이의를 제기하지 않는다.\n\
  \n\n제 11 조 (기타사항)\n①본 계약에 명시되어 있지 않은 사항은 상호 협의로 결정하고, 합의가 이루어지지 않으면 관계법령 및 일반적인\
  \ 상거래의 관례에 따른다. \n②본 계약과 관련하여 분쟁이 발생한 경우에는 서울중앙지방법원을 양당사자의 합의에 따른 전속적 제1심 관할 법원으로\
  \ 한다.\n\n본 계약의 성립을 증명하기 위하여 본 약정서 2부를 작성하고, \"갑\"과 \"을\"이 각각 서명 날인 한 후 1부씩 보관한다.\n\
  \n\n20  년   월   일 \n\n갑: 미래에셋생명보험(주)\n서울시 강남구 테헤란로 507\n(삼성동, 일송빌딩)\n대표이사 하 만 덕\
  \ (인)\n\n갑: 미래에셋생명보험(주)\n서울시 강남구 테헤란로 507\n(삼성동, 일송빌딩)\n대표이사 하 만 덕 (인)\n\n을: OOOOOOOOO\n\
  OOOOOOOOOOOOOOO\n대표이사 O O　O (인)\n\n을: OOOOOOOOO\nOOOOOOOOOOOOOOO\n대표이사 O O　O (인)\n\
  \n\n\n"
