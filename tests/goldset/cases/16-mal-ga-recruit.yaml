text: "GA에이전트 신분 위촉 계약서\n\n미래에셋생명보험주식회사(이하”회사”라 한다)는 회사와 보험 대리점 표준위탁계약서(이하”GA 계약”이라\
  \ 한다)를 체결한 [              ]에게 “GA계약서” 제3조 ”위탁업무” 제 1항 제 7호, 및 “위탁계약에 대한 부속약정서” 제\
  \ 2조(위탁업무의 범위) 제 2항에 의거하여 GA에이전트로 위촉하고자 [              ] 와 합의하여 아래와 같이 신분 위촉 계약을\
  \ 체결한다.\n\n제1조(목적)\n① 본 계약은 GA에이전트 신분에 대한 위탁업무(이하”위탁 업무”라 한다)의 내용 및 기타 필요한 사항을 정함에\
  \ 그 목적이 있다. \n② GA에이전트와 회사는 어떠한 경우에도 고용관계가 성립하지 않으며, 본 계약서가 유효한 가운데 행해지는 쌍방간의 향후\
  \ 어떠한 행위도 고용관계를 형성하거나 고용관계로 해석되지 아니한다.\n\n제2조(위촉기간 및 해지)\n① 본 계약의 계약기간은 계약체결일로부터\
  \ 1년으로 한다. 다만, 회사 또는 GA에이전트가 본 계약 연장 의사가 없음을 계약만료일부터 30일전에 상대방에게 서면으로 통보한 경우를 제외하고\
  \ 동일한 조건으로 1년간 자동 갱신 된 것으로 본다.\n② GA에이전트가 본 계약을 해지하고자 하는 경우, 회사에 30일 전에 서면으로 계약\
  \ 해지 의사를 통보하여야 하며, 회사는 해지 요청을 접수 받은 날로부터 30일 이내에 해지 절차를 완료하여야 한다.\n③ 회사는 다음 각 호의\
  \ 1에 해당하는 경우 위촉계약 기간 중이라 하더라도 해지하고자 하는 날의 30일 전에 GA에이전트에게 서면에 의한 통지로 업무위탁의 의사를 철회하고\
  \ 본 계약을 해지할 수 있다. 이 때 회사는 위촉계약 해지통지서를 GA에이전트가 회사에 알린 최종주소지로 내용증명우편으로 발송하여야 한다. 다만,\
  \ GA에이전트가 주소지 변경신고를 하지 아니하였거나, GA에이전트가 해지통지서 수령을 거부하는 등 GA에이전트의 귀책사유로 인하여 송달이 되지\
  \ 아니한 경우에는 직전 최종주소지로 우편을 발송하여 통상적으로 도달하는데 걸리는 기간이 경과된 때에 도달하는 것으로 본다.\n\t•\tGA에이전트가\
  \ 고의 또는 중대한 과실로 본 계약서의 준수사항, 위탁업무와 관련된 회사의 규정 및 지침을 위반한 경우\n\t•\tGA에이전트가 신체적, 정신적\
  \ 질병 또는 장해 등으로 3개월 이상 정상적인 위탁업무 수행이 현저하게 곤란한 경우\n\t•\tGA에이전트가 고의 또는 중대한 과실로 위탁업무\
  \ 관련 소송 및 민원 등 분쟁으로 인하여 회사에 손실을 발생시킨 경우\n\t•\t회사의 경영상의 판단(점포 통폐합등) 및 영업상의 사유로 GA에이전트가\
  \ 위탁업무를 수행할 수 없게 된 경우\n\t•\tGA에이전트로서 위탁업무를 성실히 수행하지 않거나, 업무수행에 현저히 부적합하다고 판단되는 경우\
  \ \n\t•\tGA에이전트로서 품격에 맞지 않는 언행 등으로 GA에이전트 및 회사의 이미지에 손상을 입힌 경우 \n\t•\t보험업법 및 감독규정을\
  \ 위반하여 활동을 한 경우\n\t•\tGA에이전트 운영 최저 평가기준 미달시 또는 정상적 업무 수행이 불가능한 경우 \n\t•\t기타 GA에이전트가\
  \ 상기 항목에 준하는 위법, 부당한 행위로 인해 본 계약을 유지할 수 없다고 판단되는 경우\n④ 회사가 제2조 ③항의 4호를 제외한 사유로 본\
  \ 계약을 해지하는 경우에는 GA에이전트에게 소명기회를 부여하고 해지 여부를 결정하여야 한다.\n\n\n제3조(신분에 따른 위탁업무)\n① 본\
  \ 계약에 의해 회사가 GA에이전트에게 위탁하는 업무는 다음과 같다.\n\t•\t협약 체결된 대리점(GA)의 신계약 가입설계 지원\n\t•\t\
  협약 체결된 대리점(GA)의 상품가입 관련 지원 및 일부 교육 훈련\n\t•\t협약 체결된 대리점(GA)의 관련 정보 파악 및 보고\n\t•\t\
  협약 체결된 대리점(GA)의 보유계약관련 지원업무\n\t•\t협약 체결된 대리점(GA)의 구성원의 업무현황 파악\n\t•\t기타 회사로부터 위탁\
  \ 받은 업무\n② GA에이전트는 회사로부터 위탁 받은 업무를 타인에게 처리하게 할 수 없다. 단, 부득이한 사유가 발생한 경우 회사로부터 사전승인을\
  \ 얻어 재 위탁 할 수 있다.\n\n제4조(계약내용 변경)\n① 회사는 본 계약서상의 계약내용을 변경할 경우 GA에이전트가 변경내용을 확인할\
  \ 수 있도록 통지하고 GA에이전트의 동의를 받아야 한다.\n② 회사는 위탁업무와 관련된 회사의 규정, 지침 등을 변경할 합리적 사유가 있는 경우에는\
  \ 이를 변경할 수 있다. 이 경우 회사는 사전에 GA에이전트에게 그 변경사항에 대해 개별적으로 통지(GA에이전트 명의의 휴대전화 문자메시지 또는\
  \ SNS 메시지 발송, 이메일 발송, 우편 발송 중 하나의 방법)를 함으로써 변경내용을 고지하여야 하며, 회사가 변경내용을 고지한 날로부터 1월\
  \ 이내에 GA에이전트가 이의를 제기하지 아니하는 경우에는 그 변경사항에 동의한 것으로 간주한다.\n\n\n제5조(수수료 지급)\n① 회사는 GA에이전트에게\
  \ “GA에이전트 운영제도”를 적용하며, 제3장“수수료 지급기준”에 의거 수수료를 지급 또는 환수한다. \n② 회사는 GA에이전트가 수수료 편취를\
  \ 목적으로 위탁업무를 부당한 방법으로 수행했다고 판단되는 경우 사실관계 규명 시까지 수수료 지급기준이 정하는 바에 따라 수수료의 일부 또는 전부를\
  \ 지급 보류할 수 있다. 사실관계가 규명된 후에는 수수료 지급기준이 정하는 바에 따라 지급 보류된 부분을 지급하거나 또는 확정적으로 지급하지\
  \ 않을 수 있다.\n③ 회사는 본계약의 체결 시 GA에이전트에게 수수료 지급기준을 충분히 설명하고 GA에이전트의 동의를 받아야 한다.\n④ 회사는\
  \ 수수료 지급기준을 변경하고자 하는 경우 변경 예정 내용을 시행 예정일로부터 최소 35일전에 GA에이전트에게 서면으로 통지하고 동의를 받아야\
  \ 한다.\n⑤ 회사는 GA에이전트의 동의를 받아 수수료 지급기준을 변경할 수 있다. 회사가 수수료 지급기준의 변경내용을 GA에이전트에게 통지하고\
  \ 통지일로부터 1월 이내에 GA에이전트가 동의하지 않는다는 의사를 명시적으로 밝히지 아니하는 경우에는 동의한 것으로 본다.\n⑥ 관계법령의 제·개정\
  \ 반영 및 법규위반 소지의 해소, 단서조항 등 경미한 사항 및 모집성과와 관련이 없는 지원제도의 변경, 기타 부당경쟁 및 모집질서 개선을 위한\
  \ 변경의 경우에는 상기의 동의절차를 생략할 수 있다. 이는 위탁업무 수행과 직접적인 관련이 없는 사항을 변경하는 경우에는 동일하게 적용된다.\
  \ \n\n제6조 (손해배상) \n\t•\t회사는 다음 각 호의 1에 해당하는 경우 GA에이전트에게 손해배상 또는 구상권을 청구할 수 있다.\n\
  1. 회사의 승인 없이 위탁업무와 관련이 없는 행위를 수행함으로써 회사에 대해 법률소송 등 분쟁이\n 제기되어 손해가 발생하였을 경우\n2. 회사의\
  \ 위험선택과 관련하여 본인이 알게 된 사실을 회사에 사실대로 알리지 않았거나, 본인이 고지 받은 사실을 회사에 알리지 않음으로써 회사에 손해가\
  \ 발생하였을 경우\n3. 회사의 정보 또는 자료유출 등으로 인하여 회사에 손해가 발생한 경우\n4. 기타 본 계약에서 정한 준수사항을 이행하지\
  \ 아니하는 등 GA에이전트의 고의 또는 과실로 인해 회사에 손해가 발생하였을 경우(GA에이전트의 보험업법, 개인정보보호법, 청탁금지법 등 법규위반으로\
  \ 인하여 회사가 양벌책임을 부담하는 경우 그 벌금 또는 과태료 상당액을 포함한다)\n\t•\tGA에이전트는 다음의 어느 하나에 해당하는 경우에는\
  \ 회사에게 손해배상을 청구할 수 있다.\n1. 회사의 합리적 이유 없이 업무중지, 계약해지 등으로 인해 GA에이전트에게 손해가 발생한 경우\n\
  2. 기타 보험료 대납강요, 보험모집 실적강요 등으로 GA에이전트에게 손해가 발생한 경우\n\n제7조 (조세관련 책임)\nGA에이전트가 회사로부터\
  \ 지급 받은 수수료나 기타 이 계약에 의하여 회사로부터 받은 수입에 대해 과세되는 일체의 제세공과금은 GA에이전트가 부담한다.\n\n\n제8조(기타)\n\
  ① 본 계약의 해석에 관하여 다툼이 있는 경우에는 관련 법령 및 일반 상관례에 따른다. \n② 본 계약 종료시 GA에이전트는 회사에 속한 일체의\
  \ 서류, 금전, 교육자료 등을 지체없이 반납하여야 한다.\n\n\n상기 위촉 계약서를 체결한 증거로서 본 위촉 계약서 2매를 작성하여 각자 서명날인\
  \ 후 각각 1매씩 보관한다.\n\n\n\n20      년      월      일\n\n\n\n\n\n\n\n회사  [미래에셋생명] 보험주식회사\
  \                  대리점 [                 ]보험대리점\n[주소] 서울시 영등포구 국제금융로 56        \
  \ [주소] \n(여의도동, 미래에셋증권빌딩)                      \n대표이사     황 문 규            (인) \
  \       [대표]                   (서명)\n\n"
