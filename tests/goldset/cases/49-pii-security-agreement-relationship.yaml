# 보안관리약정서의 "제3자 제공 금지"는 제3자 제공 실행이 아니라 처리위탁 보호조항이다.
id: pii-security-agreement-relationship
desc: 개인신용정보 보안관리약정서 — 제3자 제공 동의·고지 오탐 금지
force_type: outsourcing
force_active_modules: [X-PII]
shown_must_exclude: [ALL-PII-01, ALL-PII-02, ALL-PII-03]
text: |
  개인신용정보 보안관리 약정서(일반)

  제1조(목적) 본 약정은 업무위탁계약에 따라 갑이 을에게 제공하는 고객정보의 보안관리대책을 정한다.
  제3조(업무 목적 외 이용 금지) 을은 고객정보를 위탁업무 목적 외에 이용할 수 없으며 제3자에게 임의로 제공하거나 누설하여서는 아니 된다.
  제5조(재위탁 제한) 을은 갑의 서면 승낙 없이 개인정보 처리업무를 재위탁할 수 없다.
  제6조(보호조치) 을은 고객정보 접근통제, 접근권한 제한, 암호화 및 접속기록 보관 조치를 한다.
  제16조(교육) 을은 고객정보를 처리하는 임직원에게 연 1회 이상 안전한 처리 교육을 실시한다.
