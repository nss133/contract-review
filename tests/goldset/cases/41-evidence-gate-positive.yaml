# 13차 게이트 반대면: 핵심 문언을 갖춘 진짜 조항은 억제하면 안 된다.
id: evidence-gate-positive
desc: IP침해 방어·보증보험·채권자귀책 대금청구 — 진성 근거 노출 유지
force_type: procurement
force_active_modules: [M-DELIVERY]
shown_must_include: [CMN-18, SP-DEL-04, SP-DEL-08-2]
text: |
  IT 용역계약서

  제1조(제3자 권리침해) 을은 산출물이 제3자의 지식재산권을 침해한 경우 관련 분쟁에서 갑을 방어·면책하고 모든 손해를 배상한다.
  제2조(이행보증보험) 을은 계약이행을 담보하기 위하여 이행보증보험증권을 갑에게 제출하여야 한다.
  제3조(채권자 귀책) 갑의 귀책사유로 용역 이행이 불가능하게 된 경우 을은 약정 대금을 청구할 수 있다.
