subdoc_text: "개인신용정보 보안관리 약정서(일반)\n\n미래에셋생명보험주식회사(이하 “갑”)와 OOOOOO㈜(이하 “을”)는 양 당사자간 업무상 제공되는 고객정보(개인정보,\
  \ 신용정보 포함)에 대한 보안관리 약정을 다음과 같이 체결한다.\n\n제1조(목 적)\n본 약정은 “갑”과 “을”간 체결되었거나 또는 체결될 모든 업무위탁계약 등에 근거하여 업무상의\
  \ 목적으로 “갑”이 “을”에게 제공하는 개인정보보호법, 신용정보의 이용 및 보호에 관한 법률 등 관계법령에서 보호하고 있는 고객의 개인식별정보 등 일체의 정보(이하 “고객정보”)에\
  \ 대한 보안관리대책과 책임사항을 명확히 규정함으로써 고객을 보호하고 상호신뢰 확보를 목적으로 한다.\n\n제2조(정보이전의 범위·목적 및 기간)\n “갑”이 “을”에게 이전하는\
  \ 정보 또는 “을”이 처리하는 정보는 다음 각호와 같다 \n(실제 이전하는 정보를 카테고리화 하여 작성함, 아래 예시)\n- (예시)개인식별정보 : OOO, OOO, OOO등 특정\
  \ 개인을 식별할수 있는 정보\n- (예시)계약관련정보 : OOO, OOO, OOO등\n- (예시)기타정보 : OOO (그 이외 정보가 있는 경우 작성함) \n② 제1항의 정보가\
  \ 이전되는 목적은 아래와 같다.\n- OOO 업무 목적(계약서의 위탁업무 범위의 제공의 목적 명시)\n③ 제1항의 이전되는 개인정보의 보유·이용 기간은 아래와 같다.\n- 3개월,\
  \ 1년, 계약기간과 동일한 경우 0000.00.00~0000.00.00 등으로 작성\n(이전되는 개인정보의 최소한의 보유·이용 기간 작성)\n\n제3조(업무 목적 외 이용 금지\
  \ 및 제공받은 정보 보호) \n“을”은 “갑”으로부터 제공받은 고객정보 또는 정보처리에 따른 산출물을 업무위탁계약 등에서 정한 업무를 이행하기 위한 목적 외에 다른 목적으로 이용할\
  \ 수 없으며, 제3자에게 임의로 제공하거나 누설하여서는 안 된다.\n“을”은 “갑”으로부터 제공받은 고객정보 또는 정보처리에 따른 산출물을 “갑”의 사전승인 없이 업무 목적 이외에\
  \ 별도(또는 다른 매체)로 저장∙출력하거나 복사∙가공하여서는 안 된다.\n“을”은 제1항 또는 제2항의 의무를 위반한 경우 이에 따른 민·형사상 일체의 책임을 부담하며, “갑”에게\
  \ 발생한 모든 손해를 배상하여야 한다.\n“을”은 본 조에 의한 의무를 업무위탁계약기간은 물론 계약이 해제, 해제 또는 기타 원인으로 종료된 이후에도 준수하여야 하며, “을”의\
  \ 피용자 및 기타 이행보조자도 이를 준수하여야 한다. \n\n제4조(“을”의 요건)\n“을”은 관계법령에 따라 신용정보관리·보호인, 개인정보보호 책임자, 중 어느 하나를 지정하여야\
  \ 한다.\n제1항에서 지정된 책임자는 신용정보업감독규정 별표3. Ⅲ. 1. 및 2.의 신용정보관리∙보호인으로서의 업무를 수행하여야 한다.\n\n제5조(재위탁 제한 및 재위탁시 재위탁자\
  \ 보고에 관한 사항)\n“을”은 “갑”과의 약정상의 권리와 의무의 전부 또는 일부를 제3자에게 양도하거나 재위탁할 수 없다. 다만, 다음 각호에 어느 하나에 해당하지 않는 경우\
  \ “을”은 “갑”의 서면 승낙을 얻어 재위탁할 수 있다\n  1. 관련법령에서 해당 업무의 위탁을 금지하고 있는 경우\n2. “을(재위탁사)” 또는 재수탁사가 최근 3년 이내에\
  \ 정보주체의 정보관리, 감독기관 자료 제출 등 감독기관의 검사와 관련한 사항으로 기관경고 이상의 제재 또는 형사처벌을 2회이상 받은 사실이 있는 경우\n3. 그 밖에 재위탁으로\
  \ 인하여 “(재)위탁사”의 건전성 또는 신인도를 크게 저해하거나, 금융질서의 문란 또는 정보주체의 피해발생이 심히 우려되는 경우\n제1항 단서에 따라 재위탁하는 경우, “을”은\
  \ “갑”과 제1항 각 호 어느 하나에 해당하지 않는다는 사실이 포함된 『개인신용정보 재위탁 승낙서』 또는 법규에 부합한 문서를 작성하고 신용정보업감독규정 별표4의 내용 등 기타\
  \ 필요한 사항이 포함된 『개인신용정보 보안관리 약정서(재위탁)』 또는 법규에 부합한 문서를 재수탁자와 체결하여 “갑”에게 제출하여야 한다. \n“을”은 재수탁자의 임직원이 보안서약서를\
  \ 작성 및 제출하도록 재수탁자를 관리∙감독하여야 한다.\n\n제 6조(물리적 기술적 관리적 보호조치)\n“을”은 고객정보가 분실∙도난∙유출∙변조 또는 훼손되지 아니하도록 다음 각\
  \ 호의 안전성 확보에 필요한 기술적∙관리적 및 물리적 조치를 하여야 한다. 구체적인 조치는 신용정보업감독규정 별표 3에 따른다.\n고객정보의 안전한 처리를 위한 내부 관리계획의\
  \ 수립∙시행\n고객정보에 대한 접근 통제 및 접근 권한의 제한 조치\n고객정보를 안전하게 저장∙전송할 수 있는 암호화 기술의 적용 또는 이에 상응하는 조치\n고객정보 침해사고 발생에\
  \ 대응하기 위한 접속기록의 보관 및 위∙변조 방지를 위한 조치\n고객정보에 대한 보안프로그램의 설치 및 갱신\n고객정보의 안전한 보관을 위한 보관시설의 마련 또는 잠금장치의 설치\
  \ 등 물리적 조치\n정보처리기기 컴퓨터 바이러스 방지조치\n개인(신용)정보 출력∙복사 시 보호조치\n개인(신용)정보 오남용에 대한 제재기준 마련\n\n제 7조(활용 통제 및 전담\
  \ 관리자 지정)\n“을”은 “갑”으로부터 제공받은 고객정보를 처리하는 “을”의 임직원 기타 “을”의 수탁자(이하 “정보취급자”라 한다)를 제한하여야 하며, 각각에게 전용 ID 부여\
  \ 및 패스워드를 설정하도록 한다.\n“을”은 정보취급자가 고객정보에 접근할 경우 ID 및 패스워드를 통해 그 권한을 확인하여야 하며, 각 정보취급자의 고객정보 접근 및 이용현황을\
  \ 기록•관리하여야 하며, “갑”이 해당 기록을 요청하는 경우 이에 응하여야 한다.\n“을”은 “갑”으로부터 제공받은 고객정보가 보관된 장소에 대해 출입통제장치 등 적절한 보안대책을\
  \ 강구하여야 한다. \n“을”은 “갑”으로부터 제공받은 고객정보에 대한 관리책임자를 지정하여 “갑”에게 통보하여야 한다. \n“을”은 각 정보취급자의 ID 및 패스워드의 공유누설을\
  \ 금지하며, 각 정보취급자가 이를 준수하도록 관리∙감독할 책임을 진다.\n\n제8조(고객정보의 송수신)\n“갑”과 “을”이 고객정보를 전산데이터의 형태로 상호 송수신하는 경우 전용회선을\
  \ 이용, 암호화하여 송수신함을 원칙으로 한다.\n전용회선을 이용하지 않고 PC통신, M/T(magnetic tape), 디스켓 등을 통하여 송수신 할 경우 대상문서 전건에 패스워드를\
  \ 설정함으로써 당해 업무와 무관한 자가 임의로 열람 또는 개봉할 수 없도록 한다.\n\n제9조(고객정보 폐기 및 반환)\n“을”은 “갑”으로부터 제공받은 고객정보에 대해 사용기간\
  \ 또는 보관기간이 정해진 경우에는 그 기간 내에, 정해지지 않은 경우에는 제공목적이 충족된 이후 즉시, 업무위탁계약 등 정보제공의 근거가 된 원인계약이 종료된 경우 종료 즉시,\
  \ “갑”이 고객정보의 폐기 또는 반환을 요청하는 경우에는 요청 즉시, “을”이 사업을 폐업하는 경우에는 폐업 즉시 해당 정보를 폐기하거나 “갑”에게 반환하여야 한다. \n“을”이\
  \ 전항에 따라 고객정보를 폐기하는 경우 고객정보가 복구 또는 재생되지 않도록 전자적 파일 형태의 것은 복원이 불가능한 방법으로 영구 삭제하고, 기록물∙인쇄물∙서면∙그 밖의 기록매체인\
  \ 것은 파쇄 또는 소각하여야 한다.\n“을”은 전항의 고객정보 폐기 및 반환사유가 발생한 날로부터 5일 이내에 이를 처리하여야 하며, 그 처리 결과를 “갑” 에게 통보하여야 한다.\n\
  “갑”은 고객정보의 보안관리상태 및 정보폐기 또는 반환의 이행여부 등을 확인하기 위해 “을의 사무실 등을 점검할 수 있으며, “을”은 이에 적극 협조한다.\n\n제10조(관리•감독\
  \ 등)\n“갑”은 “을”에 대하여 다음 각 호의 사항을 관리하도록 요구할 수 있으며, “을”은 특별한 사유가 없는 한 이에 응하여야 한다.\n고객정보의 처리 현황\n고객정보의 접근\
  \ 또는 접속 현황\n고객정보 접근 또는 접속 대상자\n목적 외 이용•제공 및 재위탁 금지 준수여부\n암호화 등 안전성 확보조치 이행여부\n임직원 보안서약서 작성 및 제출\n그 밖에\
  \ 고객정보의 보호를 위하여 필요한 사항\n“갑”은 “을”에 대하여 제1항 각 호의 사항에 대한 실태를 점검하여 시정을 요구할 수 있으며, “을”은 특별한 사유가 없는 한 이행하여야\
  \ 한다. 다만 전항의 “그 밖에 고객정보의 보호를 위하여 필요한 사항”에 대하여는 “갑”과 “을”이 협의하여 결정하기로 한다.\n“갑”은 처리위탁으로 인하여 고객정보가 분실·도난·유출·변조\
  \ 또는 훼손되지 아니하도록 1년에 최소 1회 “을”을 교육할 수 있으며, “을”은 이에 응하여야 한다.\n전항에 따른 교육의 시기와 방법 등에 대해서는 “갑”은 “을”과 협의하여\
  \ 시행한다.\n\n제11조(통지의무)\n“을”은 전산사고, 정보유출사고, 관계 당국으로부터 고객정보 등 공개요구 시 “갑”에게 즉시 통보하여야 한다.\n“을”은 갑의 요청에 따라\
  \ 고객정보의 관리 및 폐기 등과 관련하여 문서∙시설∙인원 등 현황을 자체 점검하고 그 결과를 “갑”에게 통보하여야 한다.\n\n제12조(손해배상)\n“을” 또는 “을”의 임직원\
  \ 기타 “을”의 수탁자(이하 “정보취급자”라 한다)가 업무위탁계약 등에 의하여 위탁 또는 재위탁받은 업무를 수행함에 있어 본 약정에 따른 의무를 위반하거나 정보유출, 전산사고 등으로\
  \ 고객에게 손해가 발생한 경우, “갑”과 “을”은 연대하여 손해를 배상할 책임을 부담한다.\n정보취급자의 귀책사유로 인하여 본 약정이 해지되어 “갑” 또는 고객 기타 제3자에게\
  \ 손해가 발생한 경우 “을”은 그 손해를 배상하여야 한다.\n제1항과 관련하여 고객 기타 제3자에게 발생한 손해에 대하여 “갑”이 전부 또는 일부를 배상한 때에는 “갑”은 이를\
  \ “을”에게 구상할 수 있다.\n\n제13조 (고객정보 보안관리 약정의 해지)\n“갑”은 “을”이 본 약정상의 의무를 위반하거나 정보처리 업무 위탁의 근거가 되는 금융위원회의 규정에\
  \ 위배되는 행위를 하는 경우, 별도의 위약금 없이 고객정보의 제공을 중지하거나 업무위탁계약 등을 해지할 수 있다.\n\n제14조(감독기관에 대한 협조)\n“갑”과 “을”은 위탁되는\
  \ 정보처리 업무와 관련하여 금융위원회 또는 금융감독원의 자료제출 등 감독 및 검사를 위한 요구에 성실히 응하여야 한다.\n\n제15조(효력발생 및 유효기간)\n본 약정은 체결일로부터\
  \ 그 효력이 발생하며(본 약정 체결 전 업무위탁계약 등에 따른 보유 고객정보에 대하여도 본 약정의 효력이 미친다.), “갑”과 “을” 상호간 고객정보의 제공 또는 활용과 관련한\
  \ 계약(업무위탁계약 등)이 유효하거나 “을”이 고객정보를 보유하고 있는 한 이 약정도 유효한 것으로 한다.\n본 약정의 유효기간 내에 발생한 “을”의 위반행위에 따른 책임은 유효기간의\
  \ 만료로 소멸되지 아니한다.\n\n제16조(교육)\n“을”은 “갑”으로부터 제공받은 고객정보를 처리하는 “을”의 임직원 기타 “을”의 수탁자에 대하여 개인(신용)정보의 분실∙도난∙유출∙변조∙훼손의\
  \ 방지 및 안전한 개인(신용)정보의 처리에 관한 교육을 연 1회 이상 실시함으로써 고객정보의 오∙남용 발생을 예방하여야 한다.\n\n\n\n제17조(기타)\n본 약정에서 정하지\
  \ 아니한 사항은 개인정보보호법 및 신용정보의 이용 및 보호에 관한 법률 등 관계법령에서 정한 바에 의하고, 관계법령에서도 정하지 아니한 사항은 상호 협의하여 정하기로 하며, 합의가\
  \ 이루어지지 않는 경우에는 서울중앙지방법원을 제1심 관할법원으로 한다.\n\n\n본 약정의 체결 증거로서 갑과 을은 약정서 2부를 작성하여 양 당사자가 날인한 후 각각 1부씩 보관한다.\n\
  \n\n20  년  월  일\n\n\n\n“갑”                                                 “을”\n서울특별시 영등포구 국제금융로 56\
