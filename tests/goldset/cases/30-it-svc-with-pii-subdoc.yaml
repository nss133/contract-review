id: it-svc-with-pii-subdoc
desc: IT용역 본계약 + 보안관리약정서 부속 — 부속서류 커버 검증
detect_expected: procurement
# 본계약(케이스19=mal-it-svc) 본문에는 "개인(신용)정보보안관리약정서"가 첨부목록에만 등장하고
# X-PII 활성 트리거 키워드(개인정보/신용정보/고객정보/정보주체/개인신용정보)와 문자열이 겹치지
# 않아(괄호로 끊김) 본문만으로는 X-PII가 활성화되지 않음 — 실사용에서는 검토자가 스크리닝 질문에
# 수동 체크하는 경로. 골드셋에서 이를 재현하기 위해 force_active_modules로 X-PII를 강제 활성.
force_active_modules: [X-PII]
# 실측(1차 실행): force_active_modules로 X-PII 활성 시 본계약 consider = [ITDL-06, PRIV-03, PRIV-05,
# PRIV-06, PRIV-15] — 부속서류(약정서)가 4건 모두 커버(PRIV-05는 subDocCoverage 자체가 confirmed·
# review 둘 다 커버로 인정하는 관대한 게이트라 review-tier로도 포착됨). 브리프 시드(PRIV-02·03·05)의
# PRIV-02는 애초 본계약 consider에 없어(케이스29에서도 weak-role로 confirmed 불가한 항목) 제외,
# 실측된 4건 전체를 어서션으로 채택.
subdoc_must_cover: [PRIV-03, PRIV-05, PRIV-06, PRIV-15]
text: "\n\n\n\n\nOOOO 프로젝트 용역 위탁 계약서\n\n 계약서\n\nOOOO 프로젝트 용역 위탁 계약서\n\n 계약서\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n2016. 00. 00.\n\n\n\n\n\n\n미래에셋생명보험 주식회사\nOOOO 주식회사\n\f\n미래에셋생명보험 주식회사(이하 “갑”이라 한다.)와 OOOO 주식회사(이하\
  \ “을”이라 한다)는 “OOOOO OOO 프로젝트”(이하 “프로젝트” 이라 한다) 에 대하여 다음과 같이 계약을 체결한다.\n\n제1조(계약의 목적 및 배경)\n\t•\t본 계약의\
  \ 목적은 “을”이 프로젝트를 수행하며, “갑”이 “을”에게 그에 대한 대가를 지급하는 것과 관련된 제반 사항을 정하는데 있다.\n\t•\t“갑”과 “을”은 계약의 목적과 취지에\
  \ 따라 신의로서 성실하게 자기의 의무를 이행하여야 한다.\n\n제2조(계약기간) \n본 계약의 구축기간은 2016년 00월 00일부터 2016년 00월 00일까지로 한다. 단,\
  \ 구축기간의 연장 또는 단축이 필요하다고 판단될 경우 “갑”과 “을”은 별도의 서면합의로써 이를 변경할 수 있다.\n\n제3조(계약 범위 및 계약금)\n“을”의 프로젝트에 대한\
  \ 총대가(이하 “계약금액”이라 한다)는 일금 O천O백O십만원정(￦000,000,000원/부가가치세 포함)으로 한다. 구축 범위는 별첨 견적서 및 프로젝트 수행계획서와 같으며, “갑”에\
  \ 의한 과업내용 또는 그 수행방식 변경으로 인하여 소요비용의 변경이 발생될 경우, “갑”과 “을”이 서면 합의하여 별도로 정산하기로 한다.\n\n                 \
  \                                                   \n제4조(계약금의 청구 및 지급)\n“갑”은 “계약금액”에 대하여 “을”의 청구일로부터\
  \ 00일 이내에 다음 각호에서 정한 방법으로 지급한다.\n\t•\t “계약금액”의 00%에 상당하는 일금 0천0백만원정 (￦00,000,000원/부가가치세 포함)을 선금으로 본\
  \ 계약 체결 후 “을”의 청구에 따라 이를 지급한다.\n\n\t•\t“계약금액”의 00%에 상당하는 일금 0천0백만원정 (￦00,000,000원/부가가치세 포함)을 잔금으로 “을”이\
  \ 개발완료 보고서를 “갑”에게 제출하고 “갑”의 확인절차 수행 이후 “을”의 청구에 따라 이를 지급하기로 한다.\n\n제5조(이행보증보험증권의 제출)\n“을”은 본 계약의 이행을\
  \ 보증하기 위하여 본 계약 체결일로부터 00일 이내 총 계약금액의 00%에 상당하는 이행보증보험증권을 “갑”에게 제출하여야 하며 이의 위반 시 본 계약의 효력은 발생하지 아니한다.\n\
  \n\n제6조(시스템의 인도 및 검수)\n\t•\t“을”은 시스템을 별첨 프로젝트 수행계획서에 따라 “갑”에게 설치∙인도하여야 한다.\n\t•\t“을”의 시스템 인도 후 “갑”의\
  \ 시스템 검수 및 완료보고가 완료된 때에 본 계약에 따른 시스템 공급의무가 종료된 것으로 본다.\n\t•\t“갑”은 “을”이 시스템을 별첨 프로젝트 수행계획서에 따라 설치∙인도\
  \ 및 검수요청 후 00일 이내에 검수를 완료하여야 하며, 검수결과의 통보 없이 검수요청일로부터 00일이 경과한 경우 시스템에 대한 검수가 완료된 것으로 본다.\n\t•\t“을”은\
  \ “갑”의 검수결과 시스템이 프로젝트 수행계획서에서 정한 업무범위에 대한 검수를 통과하지 못할 경우 시스템을 수정 또는 보완하여야 하며, 이에 대해 추가 비용이 발생할 시에는 “을”이\
  \ 부담한다. “을”은 수정 또는 보완 후 “갑”에게 재검수를 요청해야 하고, 재검수에 대해서도 본 조 제3항의 규정이 적용된다.\n\t•\t인도일이 계약종료일 이전이면 비록 검수가\
  \ 계약기간이 경과된 시점에 종료되었더라도 “을”은 제8조에서 정한 지체상금을 지급할 의무를 지지 않는다. 단, “을”의 귀책사유로 “갑”의 검수기간이 연장되어 인도 또는 검수기간이\
  \ 연장되는 경우 “을”은 지체상금에 대한 지급의무가 있다.\n\n제7조(자료의 제공)\n\t•\t“을”은 시스템의 인도와 동시에 “갑”의 원활한 시스템 사용을 위하여 필요한 자료를\
  \ “갑”에게 제공하여야 한다. \n\t•\t기타 “갑”이 시스템의 사용 및 유지를 위하여 필요한 자료를 요구할 경우 “을”은 이를 즉시 제공하여야 한다.\n\t•\t“을”이 “갑”에게\
  \ 제공한 모든 자료의 사용은 “갑”이 시스템의 원활한 사용을 위한 범위에 한한다.\n\n제8조(지체상금)\n\t•\t“을”이 시스템을 계약만료일까지 인도하지 못한 경우 “을”은\
  \ 지체 1일당 계약금액 총액의 0/1000에 해당하는 금액을 “갑”에게 지급하여야 한다.\n\t•\t“갑”은 위 지체상금을 계약금액에서 공제할 수 있다. 단, 지체상금의 총액은\
  \ 계약금액 총액을 초과할 수 없다.\n\n제9조(지적재산권)\n\t•\t시스템 구축과정에서 산출된 프로그램 및 자료에 대한 일체의 권리는  “갑”에게 귀속되며, “을”은 본 계약을\
  \ 이행하기 위한 범위 내에서만 동 프로그램 및 자료 등을 배포, 개량하는 등의 지적재산권을 사용할 수 있다.\n\t•\t“을”이 전항의 프로그램 및 자료 등을 배포, 개량함으로\
  \ 인하여 “갑”의 지적재산권을 침해하거나, “갑”이 본 계약의 목적을 달성하지 못함으로써 “갑”에게 손해가 발생할 경우 “을”은 “갑”의 손해를 배상하여야 한다.\n\t•\t“을”은\
  \ “갑”이 시스템을 사용함에 있어서 발생하는 소유권 및 사용권 등 지적재산권과 관련된 모든 법적 분쟁으로부터 “갑”을 면책시켜야 하며, 이로 인하여 “갑”에게 손해가 발생하는 경우\
  \ 이를 배상하여야 한다.\n\n제10조(하자보수보증) \n\t•\t공급물품 및 시스템에 대한 “을”의 무상 보증 및 하자보수기간은 “갑”의 시스템 검수 및 완료보고가 완료된 시점으로부터\
  \ 00개월로 한다. 단, 하자의 원인이 다음 각 호의 하나에 해당하는 경우에는 유상으로 하고, 이를 실비 정산한다.\n\t•\t“을”의 동의 없이 “갑”이 일방적으로 행한 시스템의\
  \ 개조, 변경 또는 기타 장치, 부착시스템 사용상의 변경\n\t•\t“을”의 귀책사유 없는 시스템 가동여건의 변화\n\t•\t천재지변\n\t•\t“을”은 무상하자보증기간 동안 1년\
  \ 365일, 1일 24시간 “갑”의 하자보수 요청에 응하여야 한다.\n\t•\t제1항의 기간이 경과한 이후에 “을”은 “갑”의 요구에 따라 별도의 유지보수계약을 체결할 수 있으며,\
  \ 이 경우 유지보수계약은 상호 협의하여 별도 체결한다.\n\t•\t공급물품에 대한 부품의 추가 시에는 공급가에 적용한 동일 할인율을 적용하여 납품하기로 한다.\n\n제11조(하자보증보험)\
  \ \n “을”은 제10조 하자보수에서 규정한 무상하자보수를 보증하기 위해 최종 검수일로부터 00일이내 계약금액의 00%에 해당하는 금액을 하자보증보험증권으로 갑에게 제출하여야 한다.\n\
  \n제12조(하자보수서비스의 제공)\n\t•\t“을”은 “갑”의 감독하에 하자보수 서비스를 수행하며, “갑”의 요청에 대하여 최대한 협조할 의무가 있다.\n\t•\t“을”은 “갑”의\
  \ 장애발생 신고를 접수한 때로부터 0시간 이내에 장애발생지역에 도착하고 0시간 이내에 “장비”의 정상가동을 확보하여야 하고“을”은 이를 위한 비상연락망을 구축하여야 한다.\n\t\
  •\t하자보수의 처리 시한은 요청 당일을 원칙으로 하되 당일처리가 어려운 경우에는 \"갑\"의 사전승인을 얻어 이를 시행하여야 한다.\n\t•\t“을”은 하자보수서비스 제공에 소요되는\
  \ 부품비, 인건비, 출장비 등을 포함한 일체의 비용을 부담한다. 단, “갑”과 “을”의 별도 서면 합의가 있는 경우에는 그러하지 아니한다.\n\n제13조(자문 및 교육)\n“을”은\
  \ “갑”의 요청이 있을 때 시스템의 사용과 관련된 자문 및 교육을 “갑”에게 실시하여야 하며, 교육의 범위, 장소, 일정 등에 대하여는 상호 협의하여 정한다.\n\n제14조(손해배상)\
  \ \n“을”은  “을”의 귀책사유로 인하여 시스템의 하자 등 “갑”또는 제3자의 인명 및 재산상의 손해를 비롯한 제반 손해가 발생한 경우 “을”은 이에 대한 모든 손해배상책임을\
  \ 부담한다. 또한 본 계약과 관련하여 “갑”이 제3자로부터 민원, 소송, 신청 및 각종 쟁송 등의 분쟁을 제기 당한 경우 “을”은 그로부터 “갑”을 면책시키며, 그와 관련된 일체의\
  \ 비용(변호사보수, 판결금액, 합의금액  등)을 “을”이 부담한다.\n\n제15조(비밀유지의무)\n\t•\t“을”은 본 계약에 따라 시스템을 개발하는 동안 취득한 “갑”의 모든\
  \ 정보를 누설하거나 “갑”의 동의 없이 사용하지 못한다.\n\t•\t“을”은 전항의 비밀준수 의무를 위반한 경우 그로 인하여 발생되는 모든 손해에 대하여 배상하여야 한다.\n\t\
  •\t위 ①, ②항에 대해서 “을”은 을의 피용인, 기타 이행보조자의 행위에 대해서도 그 책임을 진다.\n\t•\t본 계약상 비밀유지의무는 본 계약의 종료, 해제 또는 해지 이후에도\
  \ 존속한다.\n\n제16조(청렴계약이행)\n\t•\t① “을”은 본 계약체결 및 이행과 관련하여 “갑” 또는 “갑”의 관계 임직원에게 직∙간접적으로 금품, 향응의 뇌물이나 부당한\
  \ 이익을 제공하지 않는다.\n\t•\t“을”이 제 1항을 위반하는 경우 “갑”은 본 계약을 해제 또는 해지할 수 있으며 “을”은 이와 관련된 일체의 손해배상청구 등 민∙형사상 이의를\
  \ 제기하지 않는다.\n\t•\t“을”은 계약기간 동안 “갑”의 감사 또는 준법감시와 관련하여 필요할 경우 계약사항의 거래 및 구매부분에 한해 회계장부 열람 요구에 적극 협조할 의무가\
  \ 있다.\n\n제17조(양도금지 및 하도급 금지)\n\t•\t“을”은 “갑”의 사전 서면동의 없이 본 계약상의 권리∙의무의 전부 또는 일부를 제3자에게 양도하거나 담보로 제공할\
  \ 수 없다.\n\t•\t본 계약상 시스템 개발은 “을”이 이를 직접 수행하여야 하며 하도급은 허용되지 않는다. 단, “갑”이 객관적으로 불가피한 사유가 있다고 볼 경우 “을”은\
  \ “갑”의 사전동의를 얻어서 이를 수행할 수 있으나, 이 경우 “을”은 “갑” 또는 제3자에 대하여 하도급으로 인하여 발생하는 모든 손해에 대하여 책임을 진다.\n\n제18조(불가항력)\n\
  전쟁, 폭동, 내란, 천재지변 등 불가항력적인 사유로 인하여 “을”이 시스템을 인도할 수 없게 되거나 용역을 수행할 수 없게 된 경우 양 당사자는 본 계약상의 책임을 지지 아니한다.\n\
  \n제19조(계약의 해제 또는 해지)\n\t•\t“갑” 또는 “을”은 상대방에게 다음 각 호에 해당하는 사유가 발생한 경우 상대방에 대한 별도의 시정을 최고함이 없이 즉시 본 계약을\
  \ 해제 또는 해지할 수 있다.\n1. 상호간에 별도 서면 합의한 경우\n2. “을”이 금융관계 법규 위반 등으로 신용질서를 문란케 한 경우\n3. 각 당사자의 지휘감독기관 및 관계법령의\
  \ 제정, 변경으로 본 계약을 이행할 수 없는 경우\n4. 각 당사자의 주요자산에 대한 압류, 가압류, 가처분 등의 결정이 내려지거나, 기타 이에 준하는 법적 절차의 진행으로 인하여\
  \ 본 계약의 이행이 어려운 경우\n5. 양 당사자 중 일방이 다른 회사로 흡수합병 되거나 주요자산이 양도되는 등 일방 당사자의 회사지배구조에 중대한 변화가 발생하거나 발생할 가능성이\
  \ 확인되어 이로 인하여 계약의 유지가 객관적으로 어려운 경우\n6. 당사자 중의 일방에 대하여 해산, 파산, 기업구조개선(Work-out) 또는 이에 유사한 절차가 신청되거나 동\
  \ 절차가 개시되는 경우 또는 기업구조조정촉진법상 주 채권은행에 대하여 부실징후기업으로 판단되는 경우 또는 당사자가 발행한 수표 또는 어음이 부도 처리된 경우\n7. 일방 당사자가\
  \ 불가항력적인 사유로 인하여 본 계약을 이행할 수 없는 경우\n\t•\t“갑”은 다음 각 호에 해당하는 사유가 발생한 때에는 “을”에게 서면으로 그 시정을 최고하고 00일 이내에\
  \ 시정되지 아니한 때 본 계약을 해제 또는 해지할 수 있다.\n1. “을”이 정당한 이유 없이 약정한 인도 기일까지 시스템을 인도하지 못하거나 기타 의무사항의 이행을 기대 할 수\
  \ 없는 명백한 사유가 있는 경우\n2. 계약조건의 위반으로 인하여 계약목적 달성이 현저히 곤란한 경우\n\t•\t제1항 및 제2항에 의하여 계약을 해제 또는 해지하는 경우 해제\
  \ 또는 해지의 의사표시는 서면으로 통지하여야 하며 해제 또는 해지의 효력은 그 통지가 상대방에게 도달한 때에 발생하고(영업시간 이외에 도달한 경우에는 그 익일에 도달한 것으로 본다),\
  \ 본 조 제1항 제7호 이외의 사유로 해제 또는 해지하는 경우 해제 또는 해지원인을 야기한 자에게 손해배상을 청구할 권리를 가진다.\n\t•\t제1항 및 제2항 각호의 사유로 계약을\
  \ 해제하는 경우 “을”은 “을”의 비용으로 프로젝트 수행 이전 상태로 “갑”의 전산시스템 및 제반 환경을 원상복구 하여야 한다.\n\t•\t“갑”의 귀책사유로 인하여 계약이 해지될\
  \ 경우 “갑”은 해지일 현재까지 투입된 용역에 대하여 미지급된 청구금액을 지급하여야 한다.\n\t•\t제5항에 따른 해지의 경우 해지시점까지 투입된 용역비용은 다음과 같이 계산한다.\L\
  용역투입비용 = (해지일까지의 투입M/M × 등급별 인원단가) ― 기지급액\n\t•\t본 계약이 해제 또는 해지된 경우 “을”은 “갑”으로부터 제공 받은 일체의 문서 및 기타  \
  \ 자료의 원본 및 사본을 “갑”에게 반환하여야 한다.\n\t•\t“을”은 “을”의 귀책사유로 인하여 본 계약이 해제 또는 해지되어 발생하는 “갑”의 손해에 대하여 이를 배상하여야\
  \ 한다.\n\t•\t본 계약의 해제 또는 해지는 제14조에서 정한 “갑”의 손해배상 청구에 영향을 미치지 아니한다.\n\n제20조(계약의 해석)\n\t•\t본 계약은 사전 어떠한\
  \ 구두합의 또는 서면합의에 우선한다.\n\t•\t본 계약의 해석에 관하여 “갑”과 “을”사이에 이견이 있는 경우 양 당사자의 합의에 의하고 합의에 이르지 못할 경우 상법, 상관습,\
  \ 민법, 조리에 따른다.\n\t•\t견적서 및 프로젝트 수행계획서의 내용은 본 계약의 내용에 포함되며, 본 계약과 견적서 등 “첨부서류”의 내용이 충돌할 경우 본 계약이 우선한다.\n\
  \n제21조(계약내용의 변경)\n본 계약내용의 변경(추가, 삭제, 변경 등 포함)은 양 당사자 또는 양 당사자로부터 적법하게 권한을 위임 받은 자에 의하여 상호 서면합의에 의하여만\
  \ 가능하다.\n\n제 22조(합의 관할)\n본 계약에 관한 일체의 법적분쟁에 관하여는 “갑”의 본사 소재지를 관할하는 법원을 관할법원으로 한다.\n\n본 계약을 증명하기 위하여\
  \ “갑” 과 “을”은 본 계약서 2부를 작성, 기명 날인하여 각각 1부씩 보관한다.\n\n\n※ 첨부서류\n1. 견적서 1부 \n2. 프로젝트 수행계획서 1부\n3. 개인(신용)정보보안관리약정서\
