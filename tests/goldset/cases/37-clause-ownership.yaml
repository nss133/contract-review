# 실사용 오탐 고정(2026-08-05 사용자 보고) — 타 조항 참조로 인한 오매칭.
# 사고: "제35조(반대수익자 매수청구권)"라고 표제가 명확한데도 그 조항에 수익자총회 결의
# (INV-BEN-01)·변경 공시(INV-BEN-04) 체크가 함께 붙음. 원인은 매수청구권 조항이 요건을
# 적으면서 "신탁계약의 변경에 대한 수익자총회의 결의에 반대하는 경우"라고 **다른 제도를
# 전제로 참조**하기 때문 — 그 언급은 참조이지 그 제도를 규정한 것이 아님.
#
# 고정 대상: ① 매수청구권 조항의 소유자는 INV-BEN-02 ② 참조 언급만으로 붙던 체크는 비노출
#            ③ 각 제도의 진짜 조항(제34조 총회·제36조 공시)에는 정상 부착
id: clause-ownership
desc: 신탁계약서 조항 귀속 — 타 조항 참조 언급으로 엉뚱한 체크가 붙지 않을 것
detect_expected: investment
stance_expected: beneficiary
# 각 체크는 자기 조항에 붙어야 함(제34조·제35조·제36조가 각각 존재)
addressed_must_include: [INV-BEN-01, INV-BEN-02, INV-BEN-04]
text: |
  미래에셋맵스일반사모부동산투자신탁제9호 신탁계약서

  집합투자업자 ○○자산운용 주식회사와 신탁업자 ○○은행 주식회사는 다음과 같이 신탁계약을
  체결한다.

  제33조 (신탁계약의 변경)
  ① 집합투자업자는 신탁계약을 변경하고자 하는 경우 신탁업자와 변경계약을 체결하여야 한다.
  ② 집합투자업자·신탁업자가 받는 보수의 인상, 신탁업자의 변경, 신탁계약기간의 변경에
  해당하는 사항을 변경하는 경우에는 미리 수익자총회의 결의를 거쳐야 한다.

  제34조 (수익자총회)
  ① 투자신탁에는 전체 수익자로 구성되는 수익자총회를 두며, 수익자총회는 집합투자업자가
  소집한다.
  ② 수익자총회는 출석한 수익자의 의결권의 과반수와 발행된 수익증권 총좌수의 4분의 1
  이상의 수로 결의한다.

  제35조 (반대수익자의 수익증권매수청구권)
  ① 수익자는 제33조제2항에 따른 신탁계약의 변경에 대한 수익자총회의 결의에 반대하는 경우
  수익자총회 전에 서면으로 반대의사를 통지하고, 그 결의일부터 20일 이내에 수익증권의 매수를
  청구할 수 있다.
  ② 집합투자업자는 제1항의 매수청구가 있는 경우 수익자에게 수익증권의 매수에 따른 수수료
  그 밖의 비용을 부담시켜서는 아니 된다.

  제36조 (공시 및 통지)
  집합투자업자는 신탁계약을 변경한 경우 인터넷 홈페이지 등을 이용하여 공시하여야 하며,
  수익자총회 결의를 거친 변경의 경우에는 공시 외에 이를 수익자에게 통지하여야 한다.

  제37조 (보수 및 수수료)
  집합투자업자 보수는 연 0.7퍼센트로 하고, 신탁업자 보수는 연 0.05퍼센트로 하며, 매일
  신탁재산의 순자산총액에 보수율을 곱하여 계산하여 매 3개월 후급으로 지급한다.

  집합투자업자: ○○자산운용 주식회사
  신탁업자: ○○은행 주식회사
  수익자: 미래에셋생명보험 주식회사
