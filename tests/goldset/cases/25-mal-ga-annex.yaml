text: "[수수료의 환수와 회사의 지원 등 세부사항에 관한 부속약정서] \n\n미래에셋생명보험주식회사(이하 “회사”라 한다)와 [       \
  \ ] 보험대리점(이하 “대리점”이라 한다)은 회사와 대리점 간에      년     월    일 체결된 위탁계약(서)(이하 “위탁계약(서)”)\
  \ 제32조 제2항에 의거하여 다음과 같이 부속약정서(이하 “본 약정서”)를 체결한다.\n\n제1조(목적)\n“본 부속약정”은 “회사”의 “대리점”에\
  \ 대한 영업관련 구체적인 지원방법 등을 정하고, 특정 금융거래정보의 보고 및 이용에 관한 법률 및 관련 규정 등에 따른 고객확인의무를 “대리점”이\
  \ 수행토록 하는데 그 목적이 있다. \n\n제2조(수수료의 지급 및 환수)\n① “회사”는 “대리점”에게 “GA영업제도”를 적용하며, “자립\
  \ GA 기준”에 의거 수수료를 지급 또는 환수한다.\n② “대리점”은 “회사”의 상품판매업적에 따라, 수수료 환수를 보증하기 위하여, 영업보증금과\
  \ 별도로 [     ]천만원 이상의 이행보증금 또는 이에 상응하는 액수의 다음 각 호의 담보 중 하나 이상을 추가로 제공하여야 한다.\n1.\
  \ 보증보험증권\n2. 예금 등에 대한 질권설정\n3. 기타 회사가 인정하는 담보\n③ 이행보증금 또는 담보가액의 변경이 필요한 경우, “회사”는\
  \ 추가적인 이행보증금 또는 담보의 제공을 요구할 수 있고 특별한 사정이 없는 한 “대리점”은 이에 응하여야 한다. \n\n제3조(회사의 대리점에\
  \ 대한 지원)\n①“회사”는 다음 각 호의 사항을 “대리점”에게 지원할 수 있다.\nIT 관련 지원(PC, 프린터, 스캐너, ADSL등)\n\
  계약관련 인쇄물\n문서수발(행랑)\n무양식 System 지원\n기타 “회사”와 “GA”의 합의에 따른 지원\n② “회사”가 “대리점”에게 지원한\
  \ IT관련 물품의 소유권은 “회사”에게 귀속된다. \n③ 제 ①항에 의거 지원한 지원항목은 별첨으로 첨부하고 변동이 생길 경우 회사와 대리점은\
  \ 변동사항을 상호 확인하여야 하며 대리점은 확인서를 작성하여 회사에 제출한다. 이 경우 변경된 확인서는 기존의 확인서를 대체한다.\n④ “회사”는\
  \ “대리점”이 무실적 이거나 그 실적이 현저히 부진 하다고 판단한 때, 지원물품 모두를 회수 할 수 있으며, 반환 시 소요되는 비용은 “대리점”이\
  \ 전액 부담하여야 한다. \n\n제4조(대리점의 의무)\n①“대리점”은 “회사”가 지원한 물품에 대해 선관주의의무를 다하여 손해가 발생하지 않도록\
  \ 하여야 한다.\n②“대리점”은 “회사”가 지원한 물품의 파손 및 도난 또는 분실 시 경위서, 관련사진, 도난확인서 등 관련증거를 “회사”에게\
  \ 제출해야 한다.\n③”대리점”은 “회사”가 지원한 물품을 일반적으로 작동 가능한 상태로 반납하여야 한다. 다만, “인테리어”는 반납이 불가하다.\
  \ \n④천재지변 기타 불가항력으로 인하여 회사가 지원한 물품파손 시 “회사”는” 대리점”과 협의하여 재 지급할 수 있다.\n⑤“대리점”은 보험계약의\
  \ 체결 및 유지, 관리에 있어 반드시 고객의 실명증표(주민등록증, 운전면허증, 외국인등록증, 사업자등록증 등)를 통해 실제 당사자에 대한 신원정보를\
  \ 확인해야 한다. \n⑥“대리점”은 고객확인의무와 관련하여 “회사”의 추가확인 요구가 있을 시 적극 협조해야 하며, “회사”는 “대리점”의 고객에\
  \ 대한 확인정보가 충분치 않다고 판단될 경우 해당 계약을 거절할 수 있다. \n\n제5조(배상책임)\n① “대리점”은 “회사”가 지원한 물품을\
  \ 손·망실 하였을 경우, 그에 대한 손해를 동일한 현물 또는 현금으로 배상하여야 하며, 회수관련비용은 “대리점”이 부담하여야 한다. 단, 현금\
  \ 배상시 “대리점”은 손·망실 당시 “집기비품 및 인테리어 매각금액 산출기준”을 적용하여 배상한다. \n② “대리점”이 “회사”의 반환청구에도\
  \ 불구하고 “회사”가 지원한 물품을 미반납 하는 경우, “회사”는 물품의 매수 또는 손해배상을 청구할 수 있다. 이 경우 매수대금 또는 손해배상액은\
  \ “집기비품 및 인테리어 매각금액 산출기준”을 적용하여 결정한다. \n③ 제1항의 배상시 현금으로 배상하는 경우 배상방법은 배상책임 발생시 우선“대리점”의\
  \ 수수료에서 상계하고, 부족시 “회사”는 이행보증금 및 이와 관련하여 제공된 담보를 실행하여 회수한다. \n\n제6조(약정의 변경 및 해석)\
  \ \n① “회사”는 대내외적 환경의 변화 등 사정이 변경되는 경우 “대리점”와 상호협의 하에 “본 부속약정”을 변경할 수 있다.\n② “본 약정서”의\
  \ 해석에 관하여 “회사”와 “대리점 사이에 이견이 있는 경우 양 당사자의 합의에 의하고 합의에 이르지 못한 경우에는 상법, 상관습, 민법, 조리에\
  \ 따른다.\n③ “본 약정서”와 “위탁계약(서)”의 내용이 상충되는 경우에는 “본 약정서”가 우선한다. 또한 별첨 서류의 내용은 “본 약정서”의\
  \ 내용으로 포함되고 별첨 서류 내용과 부속약정이 충돌할 경우 별첨 서류 내용이 우선한다. \n\n제7조(보험사기행위 금지)\n①“대리점”은 “회사”의\
  \ 「보험사기업무준칙」에 따른 ‘모집종사자 보험사기 금지의무’를 준수하여야 한다.\n②“대리점”은 모집사용인 신규위촉 시에 모집사용인의 보험사기\
  \ 전력 여부를 확인하여 보험사기에 연루된 자를 확인하여 “회사”에 통보할 의무가 있으며 “회사”는 모집사용인의 보험사기 연루 정도에 따라 위촉금지\
  \ 또는 해촉을 대리점에 요청할 수 있다.\n\n제8조(약정의 효력) \n“본 약정서”는 “위탁계약(서)”기간 동안에만 유효하며, “위탁계약(서)”\
  \ 종료 시 그 효력이 소멸된다. 다만, 다음 각 호의 경우에는 “위탁계약(서) 종료 이후에도 “대리점”이 그에 따른 책임을 진다.\n1. “대리점”이\
  \ “회사”에 대하여 “GA영업제도”에 의거한 수수료 환수책임을 지는 경우\n2. “대리점”이 “회사”에 대하여 지원사항의 반환의무 및 이에 따른\
  \ 회수비용, 손해배상책임 등을 지는 경우 \n3. “대리점”이 “본 GA계약”기간 중 고객확인의무를 소홀히 하여 “본 GA 계약” 종료 후 “회사”에\
  \ 손해가 발생한 경우 \n\n\n“본 부속약정”이 정히 체결되었음을 증명하기 위하여 약정서 2부를 작성하고 “회사”, “대리점”은 날인한 후\
  \ 각 1부씩 보관한다.\n\n\n20    년   월      일 \n\n【회사】\n【대리점】\n미래에셋생명보험주식회사\n\n서울시 강남구 테헤란로507\n\
