# 당사자 축(조항 주어) 고정 — 11.6차 사용자 요청.
# "제목·조 표제·당사자" 세 축 중 마지막. 같은 문언이라도 조항의 주어가 누구냐에 따라
# 검토 의미가 달라짐: "집합투자업자는 …하여야 한다"(운용사 의무)와
# "수익자는 …할 수 있다"(당사 권리)는 다른 체크가 붙어야 한다.
#
# 이 케이스는 공모 신탁계약서에서 각 조항의 주어가 서로 다르게 설정되어 있고,
# 주어와 체크 주체(subject_roles)가 맞는 쌍끼리 붙는지를 잠근다.
# 특히 제35조는 ①항 주어가 '수익자'(권리자) — 운용사 의무 체크가 붙으면 안 됨.
id: subject-axis
desc: 조항 주어 기준 매칭 — 수익자 권리 조항에 운용사 의무 체크 부착 금지
detect_expected: investment
stance_expected: beneficiary
# 각 체크가 자기 주체의 조항에 붙어야 함
addressed_must_include: [INV-BEN-01, INV-BEN-02, INV-BEN-04]
text: |
  ○○공모증권투자신탁제3호 신탁계약서

  집합투자업자 ○○자산운용 주식회사와 신탁업자 ○○은행 주식회사는 다음과 같이 신탁계약을
  체결한다. 본 투자신탁은 공모집합투자기구로서 증권신고서를 제출하고 투자설명서를 교부한다.

  제33조 (신탁계약의 변경)
  ① 집합투자업자는 신탁계약을 변경하고자 하는 경우 신탁업자와 변경계약을 체결하여야 한다.
  ② 집합투자업자는 보수의 인상, 신탁업자의 변경, 신탁계약기간의 변경에 해당하는 사항을
  변경하는 경우에는 미리 수익자총회의 결의를 거쳐야 한다.

  제35조 (반대수익자의 수익증권매수청구권)
  ① 수익자는 제33조제2항에 따른 신탁계약의 변경에 대한 수익자총회의 결의에 반대하는 경우
  수익자총회 전에 서면으로 반대의사를 통지하고, 그 결의일부터 20일 이내에 수익증권의 매수를
  청구할 수 있다.
  ② 집합투자업자는 제1항의 매수청구가 있는 경우 수익자에게 수익증권의 매수에 따른 수수료
  그 밖의 비용을 부담시켜서는 아니 된다.

  제36조 (공시 및 통지)
  집합투자업자는 신탁계약을 변경한 경우 인터넷 홈페이지 등을 이용하여 공시하여야 하며,
  수익자총회 결의를 거친 변경의 경우에는 공시 외에 이를 수익자에게 통지하여야 한다.

  제40조 (신탁재산의 보관)
  신탁업자는 신탁재산을 자신의 고유재산과 구분하여 관리하여야 하며, 집합투자업자의
  계열회사가 아니어야 한다.

  집합투자업자: ○○자산운용 주식회사
  신탁업자: ○○은행 주식회사
  수익자: 미래에셋생명보험 주식회사
