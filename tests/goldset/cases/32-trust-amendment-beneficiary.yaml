# 실사용 오탐 고정(2026-08-04 사용자 보고) — 일반사모부동산투자신탁 신탁계약 변경합의서.
# 사고: 신탁계약은 집합투자업자·신탁업자 사이의 펀드 단위 문서이고 당사는 수익자(투자자)일 뿐인데,
# 본문의 "대주주·계열회사"(운용사 이해상충 조항), "자산운용", "모집"(수익증권 모집) 문구가 검출되어
# X-ASSET(보험업 자산운용)·X-INSMOD(보험모집)·X-RELATED(대주주·계열사 거래제한)가 활성 →
# 당사가 준수주체인 양 체크리스트가 붙음. 문언 검출은 정확했으나 수범자가 당사가 아니었음.
# 고정 대상: ① 국면 자동추정이 beneficiary ② 당사자 전제 모듈 3종 비활성
#            ③ 수익자 보호 체크(INV-BEN-*)는 살아 있을 것(관점 전환의 실익)
id: trust-amendment-beneficiary
desc: 일반사모부동산투자신탁 변경합의서 — 수익자 국면(당사자 전제 모듈 오활성 금지)
detect_expected: investment
stance_expected: beneficiary
active_must_exclude: [X-ASSET, X-INSMOD, X-RELATED]
consider_must_exclude_prefix: [FIN-ASSET-, SOL-, REL-]
text: |
  미래에셋맵스일반사모부동산투자신탁제○○호 신탁계약 변경합의서

  집합투자업자 ○○자산운용 주식회사(이하 "집합투자업자")와 신탁업자 ○○은행(이하 "신탁업자")은
  미래에셋맵스일반사모부동산투자신탁제○○호(이하 "본 투자신탁")의 신탁계약(이하 "원 신탁계약")을
  다음과 같이 변경하기로 합의한다.

  제1조 (변경의 목적)
  본 합의서는 원 신탁계약 제12조에 정한 신탁계약기간을 연장하고, 제18조의 보수에 관한 사항을
  변경하기 위한 것이다. 본 합의서에 정하지 아니한 사항은 원 신탁계약에 따른다.

  제2조 (신탁계약기간의 변경)
  원 신탁계약 제12조 제1항의 신탁계약기간을 "설정일로부터 5년"에서 "설정일로부터 7년"으로 변경한다.

  제3조 (보수의 변경)
  ① 원 신탁계약 제18조 제1항의 집합투자업자 보수를 연 0.5%에서 연 0.7%로 변경한다.
  ② 신탁업자 보수는 종전과 같이 연 0.05%로 한다.
  ③ 보수는 매일 신탁재산의 순자산총액에 보수율을 곱하여 계산하며, 매 3개월 후급으로 지급한다.

  제4조 (수익자총회)
  ① 본 합의서에 따른 변경사항은 자본시장과 금융투자업에 관한 법률 제188조 제2항에 따라
  수익자총회의 결의를 거쳐 효력이 발생한다.
  ② 집합투자업자는 수익자총회의 결의에 반대하는 수익자에 대하여 법령이 정하는 바에 따라
  수익증권매수청구권을 보장한다.
  ③ 집합투자업자는 본 합의서에 따른 변경 내용을 인터넷 홈페이지에 공시하고 수익자에게 통지한다.

  제5조 (운용상 이해상충의 방지)
  집합투자업자는 신탁재산의 자산운용에 있어 집합투자업자의 대주주 및 계열회사와의 거래를
  자본시장과 금융투자업에 관한 법률 및 관계 법령이 정하는 범위 내에서만 행한다.

  제6조 (수익증권의 모집)
  본 투자신탁의 수익증권은 일반사모집합투자기구로서 적격투자자를 대상으로 모집하며,
  판매회사를 통하여 취득한 수익자는 집합투자규약에 따른 수익권을 가진다.

  제7조 (효력발생일)
  본 합의서는 수익자총회의 결의일에 효력이 발생한다.

  위 합의를 증명하기 위하여 본 합의서 2통을 작성하여 각 1통씩 보관한다.

  집합투자업자: ○○자산운용 주식회사
  신탁업자: ○○은행
