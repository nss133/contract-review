# 13차 실계약 오탐 회귀: 핵심 법률 문언 없이 주변 어휘만 겹치는 조항은 노출하지 않는다.
id: evidence-gate-decoys
desc: IP귀속·지체상금·일반해지 조항 — CMN-18·보증보험·채권자귀책 오부착 금지
force_type: procurement
force_active_modules: [M-DELIVERY]
shown_must_exclude: [CMN-18, SP-DEL-04, SP-DEL-08-2]
text: |
  물품구매계약서

  제1조(지식재산권) 산출물의 지식재산권은 갑에게 귀속되며 을은 갑의 동의 없이 제3자에게 양도할 수 없다.
  제2조(지체상금) 을은 납품을 지체한 경우 매 지체일마다 계약금액의 0.3%를 갑에게 지급한다.
  제3조(계약해지) 당사자 일방의 귀책사유로 계약 이행이 어려운 경우 상대방은 계약을 해지할 수 있다.
