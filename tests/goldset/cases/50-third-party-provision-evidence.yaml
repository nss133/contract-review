# v1.71: 실제 동의 취득·고지 증빙 확인은 계약 내용 검토의 완료 대상이 아니다.
id: third-party-provision-evidence
desc: 개인정보 제공 동의 실적 자료를 약정상 협력 의무로 오매핑하지 않음
force_type: nda
force_active_modules: [X-PII]
shown_must_exclude: [ALL-PII-01, ALL-PII-02]
text: |
  개인정보 제3자 제공 동의서

  정보주체는 아래와 같이 개인정보를 제3자에게 제공하는 데 동의합니다.
  제공받는 자: 주식회사 제휴서비스
  제공받는 자의 이용 목적: 제휴 서비스 제공 및 고객 안내
  제공하는 개인정보 항목: 성명, 연락처, 계약번호
  보유 및 이용기간: 제공 목적 달성 후 30일
  동의를 거부할 권리와 동의 거부에 따른 불이익을 안내받았습니다.
