<section class="server-session" aria-labelledby="session-title">
  <h2 id="session-title">검토 서비스</h2>
  <p id="service-status" role="status">로그인한 뒤 계약 파일을 열거나 본문을 붙여넣어 분석하세요.</p>
  <form id="login-form">
    <label>계정 <input id="login-username" autocomplete="username" required maxlength="80"></label>
    <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button id="login-submit" type="submit" class="primary">로그인</button>
  </form>
  <div id="session-tools" hidden>
    <span id="session-user"></span>
    <button id="session-logout" type="button" class="ghost">로그아웃</button>
    <button id="server-save-text" type="button" class="primary">본문 초안 저장</button>
    <button id="server-new-review" type="button" class="ghost">새 검토</button>
    <label>저장한 검토 <select id="server-review-list"><option value="">선택하세요</option></select></label>
    <button id="server-reload" type="button" class="ghost">최신본 불러오기 · 작성 중 내용 백업</button>
  </div>
</section>
